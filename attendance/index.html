<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16304d">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>일일 근태현황</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --navy:#16304d; --navy-2:#1f4268; --navy-soft:#e9eff6; --navy-ink:#1f4268;
  --bg:#f3f5f8; --card:#fff; --line:#e3e7ee; --line-2:#cfd6e0;
  --t1:#141b24; --t2:#46525f; --t3:#7b8794;
  --gold:#b98a2e; --gold-soft:#fbf3de;
  --green:#15803d; --green-soft:#e6f5ec;
  --amber:#b45309; --amber-soft:#fdf1e2;
  --red:#c2362b; --red-soft:#fdecea;
  --trip:#2563eb; --trip-soft:#e8effe;
  --hq:#0f766e; --hq-soft:#e3f4f2;
  --edu:#7c3aed; --edu-soft:#f1eafe;
  --leave:#c2410c; --leave-soft:#fdeee4;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,32,56,.06),0 4px 16px rgba(16,32,56,.05);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--t1);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:17px;line-height:1.5;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #6aa0e0;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0}

/* ---------- 버튼 · 입력 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line-2);background:#fff;font-weight:600;font-size:16px;white-space:nowrap;transition:background .12s,transform .08s}
.btn:hover{background:#f6f8fb}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.danger{color:var(--red);border-color:#f0c4c0}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.icon-btn{width:46px;padding:0}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=tel],select,textarea{width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--line-2);border-radius:10px;background:#fff;font-size:17px}
textarea{min-height:140px;resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(31,66,104,.15)}
label.field{display:block;margin-bottom:16px}
label.field>span{display:block;font-size:15px;font-weight:600;color:var(--t2);margin-bottom:6px}
.hint{font-size:14px;color:var(--t3);margin-top:6px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:16px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--navy)}

/* ---------- 로그인 ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:linear-gradient(160deg,#16304d 0%,#1f4268 55%,#2c5a86 100%)}
.login-card{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:36px 28px 28px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.login-card .mark{width:52px;height:52px;border-radius:14px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;margin-bottom:18px}
.login-card h1{font-size:24px;font-weight:800;letter-spacing:-.03em}
.login-card .sub{color:var(--t3);font-size:15px;margin:4px 0 26px}
.pin-input{letter-spacing:.4em;font-size:22px!important;font-weight:700}
.demo-note{margin-top:18px;padding:12px 14px;border-radius:10px;background:var(--gold-soft);color:#7a5a17;font-size:14px;line-height:1.55}
.err{color:var(--red);font-size:15px;font-weight:600;min-height:22px;margin:4px 0 10px}

/* ---------- 상단 ---------- */
.topbar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.topbar-in{max-width:1320px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.topbar h1{font-size:19px;font-weight:800;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar h1 small{font-weight:500;opacity:.7;font-size:14px;margin-left:8px}
.who{display:flex;align-items:center;gap:10px;font-size:15px}
.who .role{font-size:12px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.16)}
.topbar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.3);min-height:38px;font-size:14px;padding:0 12px}
.topbar .btn:hover{background:rgba(255,255,255,.1)}
.tabs{max-width:1320px;margin:0 auto;padding:0 12px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:rgba(255,255,255,.72);padding:10px 14px 12px;font-weight:700;font-size:16px;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:#fff;border-bottom-color:#f1c45b}
main{max-width:1320px;margin:0 auto;padding:20px 20px 80px}

/* ---------- 공통 카드 ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font-size:18px;font-weight:800;letter-spacing:-.02em}
.card-h .note{font-size:14px;color:var(--t3);font-weight:500}
.card-h .sp{flex:1}
.card-b{padding:18px}
.empty{padding:30px;text-align:center;color:var(--t3)}

/* ---------- 일일 현황 ---------- */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.datebox{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:var(--shadow)}
.datebox input{border:0;min-height:40px;width:170px;font-weight:700;font-size:18px;padding:0 8px;box-shadow:none!important}
.datebox .dow{font-weight:700;color:var(--navy-ink);padding-right:6px}
.datebox .btn{min-height:40px;border:0}
.toolbar .sp{flex:1}
.readonly-note{font-size:14px;color:var(--amber);background:var(--amber-soft);padding:8px 12px;border-radius:10px;font-weight:600}

.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .k{font-size:14px;color:var(--t3);font-weight:600}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.kpi .v small{font-size:16px;color:var(--t3);font-weight:600;margin-left:2px}
.kpi .s{font-size:13px;color:var(--t3);margin-top:2px}
.kpi.main{background:var(--navy);border-color:var(--navy);color:#fff}
.kpi.main .k,.kpi.main .s,.kpi.main .v small{color:rgba(255,255,255,.7)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.kpi.main .bar{background:rgba(255,255,255,.2)}
.kpi.main .bar i{background:#f1c45b}

.board{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
table.grid{width:100%;border-collapse:collapse}
table.grid th{background:#f5f7fa;color:var(--t2);font-size:14px;font-weight:700;padding:10px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.grid td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:16px}
table.grid td.c{text-align:center}
table.grid td.r{text-align:right}
table.grid tr.lv0 td{background:#fafbfd}
table.grid tr.lv0 td.name{font-weight:800}
table.grid tr.lv1 td.name{padding-left:30px;color:var(--t2);font-weight:600}
table.grid tr.lv1 td.name::before{content:'└';color:var(--line-2);margin-right:6px}
table.grid tr.sum td{background:var(--gold-soft);font-weight:800;border-bottom:0}
table.grid td.big{font-size:18px;font-weight:800}
table.grid td.lost{color:var(--red)}
table.grid tr.click{cursor:pointer}
table.grid tr.click:hover td{background:#f3f7fc}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:14px;font-weight:600;line-height:1.35}
.chip em{font-style:normal;font-weight:500;opacity:.75;font-size:13px}
.chip.trip{background:var(--trip-soft);color:var(--trip)}
.chip.hq{background:var(--hq-soft);color:var(--hq)}
.chip.edu{background:var(--edu-soft);color:var(--edu)}
.chip.leave{background:var(--leave-soft);color:var(--leave)}
.status{font-size:13px;color:var(--t3);white-space:nowrap}
.status b{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700}
.status b.done{background:var(--green-soft);color:var(--green)}
.status b.todo{background:var(--amber-soft);color:var(--amber)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--t3);padding:12px 18px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.etc-list{margin:0;padding:0 0 0 22px;line-height:1.9;font-size:16px}
.meta{font-size:13px;color:var(--t3);margin-top:10px}

/* 모바일 카드 */
.mcards{display:none}
.mcard{padding:14px 16px;border-bottom:1px solid var(--line)}
.mcard.lv0{background:#fafbfd}
.mcard.lv1{padding-left:28px}
.mcard .top{display:flex;align-items:center;gap:8px}
.mcard .nm{font-weight:800;font-size:17px;flex:1}
.mcard .nums{font-size:16px;font-weight:700;white-space:nowrap}
.mcard .nums span{color:var(--t3);font-weight:500}
.mcard .row{display:flex;gap:8px;margin-top:6px;align-items:flex-start;font-size:14px}
.mcard .row>b{flex:0 0 58px;color:var(--t3);font-weight:600;padding-top:3px}
.mcard .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}

/* ---------- 모달 ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,20,35,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:#fff;border-radius:18px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto 0}
.modal.wide{max-width:780px}
.modal-h{padding:20px 22px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.modal-h h3{font-size:21px;font-weight:800;letter-spacing:-.02em}
.modal-h p{font-size:14px;color:var(--t3);margin-top:2px}
.modal-h .x{margin-left:auto;font-size:26px;line-height:1;border:0;background:none;color:var(--t3);width:40px;height:40px}
.modal-b{padding:20px 22px}
.modal-f{padding:14px 22px 20px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-f .sp{flex:1}

.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:52px;height:52px;border-radius:12px;border:1px solid var(--line-2);background:#fff;font-size:26px;font-weight:700}
.stepper input{width:90px;text-align:center;font-size:24px;font-weight:800}
.calc{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--navy-soft);border-radius:12px;padding:14px 16px;margin:6px 0 18px;font-size:16px}
.calc b{font-size:22px;color:var(--navy)}
.cat{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.cat-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cat-h .dot{width:12px;height:12px;border-radius:4px}
.cat-h h4{margin:0;font-size:17px;font-weight:800}
.cat-h .cnt{margin-left:auto;font-weight:700;color:var(--t3)}
.cat-h small{color:var(--t3);font-size:13px;font-weight:500}
.people{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.people .chip{font-size:15px;padding:6px 6px 6px 12px}
.people .chip button{border:0;background:rgba(0,0,0,.08);color:inherit;border-radius:99px;width:26px;height:26px;font-size:16px;line-height:1}
.add-row{display:grid;grid-template-columns:1fr 1.3fr auto;gap:8px}
.add-row input{min-height:46px}

.plist{display:grid;grid-template-columns:1fr 110px 110px;gap:8px 10px;align-items:center}
.plist .h{font-size:14px;font-weight:700;color:var(--t3);text-align:center}
.plist .n{font-weight:700}
.plist input{text-align:center;font-weight:700;font-size:19px;min-height:48px}
.plist .sumrow{font-weight:800;padding-top:10px;border-top:2px solid var(--line)}

/* ---------- 통계 ---------- */
.range{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.range input{width:auto;min-height:46px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.rate{display:flex;align-items:center;gap:8px}
.rate .bar{flex:1;margin:0;height:8px;min-width:50px}
.scroll{overflow-x:auto}
.person-dates{font-size:13px;color:var(--t3);line-height:1.6}

/* ---------- 관리 ---------- */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.subtabs button{border:1px solid var(--line-2);background:#fff;border-radius:99px;padding:8px 16px;font-weight:700;font-size:15px}
.subtabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.cfg td input[type=text],.cfg td input[type=number]{min-height:40px;padding:6px 10px;font-size:16px}
.cfg td input[type=number]{width:90px;text-align:center}
.cfg td .check{min-height:36px;justify-content:center}
.cfg tr.off td{opacity:.55}
.arrows{display:flex;gap:4px;justify-content:center}
.arrows .btn{width:36px;padding:0}
.scope-box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;max-height:340px;overflow:auto}
.scope-box h5{margin:10px 0 4px;font-size:14px;color:var(--t3)}
.scope-box h5:first-child{margin-top:0}
.scope-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 12px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.roles label{border:1px solid var(--line-2);border-radius:12px;padding:12px;cursor:pointer;font-size:14px;color:var(--t3)}
.roles label b{display:block;font-size:16px;color:var(--t1)}
.roles label:has(input:checked){border-color:var(--navy);background:var(--navy-soft)}
.roles input{position:absolute;opacity:0}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:13px;font-weight:700;background:var(--navy-soft);color:var(--navy-ink)}
.tag.admin{background:var(--gold-soft);color:#7a5a17}
.tag.viewer{background:#eef0f3;color:var(--t2)}
.tag.off{background:var(--red-soft);color:var(--red)}

/* ---------- 알림 ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1b2430;color:#fff;padding:14px 20px;border-radius:12px;font-weight:600;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--red)}
.busy{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.35)}
.spin{width:42px;height:42px;border-radius:50%;border:4px solid rgba(22,48,77,.18);border-top-color:var(--navy);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.demo-banner{background:var(--gold-soft);color:#7a5a17;text-align:center;font-size:14px;padding:7px 12px;font-weight:600}

/* 인쇄 전용 머리글 */
.print-head{display:none}

@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .board{grid-template-columns:1fr}
}
@media (max-width:820px){
  body{font-size:16px}
  main{padding:14px 12px 80px}
  .topbar-in{padding:10px 14px}
  .topbar h1 small{display:none}
  .who .nm{display:none}
  .kpis{grid-template-columns:repeat(2,1fr);gap:8px}
  .kpi{padding:12px}
  .kpi .v{font-size:24px}
  .dept-table{display:none}
  .mcards{display:block}
  .two{grid-template-columns:1fr}
  .add-row{grid-template-columns:1fr 1fr}
  .add-row .btn{grid-column:1/-1}
  .plist{grid-template-columns:1fr 84px 84px}
  .datebox input{width:150px}
  .toolbar .sp{display:none}
  .roles{grid-template-columns:1fr}
  .scope-grid{grid-template-columns:1fr}
  .overlay{padding:12px 8px}
}

@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;font-size:11pt}
  .topbar,.toolbar,.kpis,.demo-banner,.no-print,.legend,.btn,.status .by{display:none!important}
  main{padding:0;max-width:none}
  .print-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:8px}
  .print-head h1{font-size:18pt;font-weight:800;flex:1;text-align:center}
  .print-head .d{font-weight:700}
  .card{box-shadow:none;border:1.5px solid #000;border-radius:0;break-inside:avoid}
  .card-h{padding:6px 8px;border-bottom:1.5px solid #000}
  .card-h h2{font-size:12pt}
  .board{grid-template-columns:1fr 62mm;gap:4mm}
  .dept-table{display:block!important}
  .mcards{display:none!important}
  table.grid th,table.grid td{border:1px solid #000;padding:3px 5px;font-size:10pt}
  table.grid th{background:#dde6f0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.grid tr.sum td{background:#fff200!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.grid tr.lv0 td{background:#fff}
  .chip{padding:0;background:none!important;color:#000!important;font-size:10pt}
  .chip+.chip::before{content:', '}
  .chips{display:inline;gap:0}
  .status{display:none}
  th.stcol,td.stcol{display:none}
  .etc-card{margin-top:4mm!important}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="./config.js"></script>
<script src="./core.js"></script>
<script src="./local-backend.js"></script>
<script src="./vendor/xlsx-0.18.5.full.min.js" defer></script>
<script src="./app.js"></script>
</body>
</html>
