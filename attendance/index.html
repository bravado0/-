<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f4f6">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="근태현황">
<title>일일 근태현황</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f2f4f6; --card:#fff;
  --g50:#f9fafb; --g100:#f2f4f6; --g200:#e5e8eb; --g300:#d1d6db; --g400:#b0b8c1;
  --g500:#8b95a1; --g600:#6b7684; --g700:#4e5968; --g800:#333d4b; --g900:#191f28;
  --blue:#3182f6; --blue-press:#1b64da; --blue50:#e8f3ff; --blue100:#c9e2ff;
  --red:#f04452; --red50:#ffeeee;
  --green:#03b26c; --green50:#e5f8ef;
  --orange:#fe9800; --orange50:#fff3e0;
  --trip:#3182f6; --trip50:#e8f3ff;
  --hq:#16a5a5; --hq50:#e1f6f6;
  --edu:#8b5cf6; --edu50:#f1ebfe;
  --leave:#f76b15; --leave50:#fff0e6;
  --dim:rgba(0,0,0,.45);
  --r-card:24px;
  --side:248px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--g900);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px;line-height:1.5;letter-spacing:-.02em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,h4,p{margin:0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:10px}
.press{transition:transform .1s ease,background-color .15s}
.press:active{transform:scale(.97)}

/* ---------- 버튼 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 20px;border-radius:14px;font-weight:600;font-size:16px;white-space:nowrap;transition:background .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-press)}
.btn.soft{background:var(--blue50);color:var(--blue)}
.btn.soft:hover{background:var(--blue100)}
.btn.grey{background:var(--g100);color:var(--g700)}
.btn.grey:hover{background:var(--g200)}
.ph .btn.grey{background:#fff}
.ph .btn.grey:hover{background:var(--g200)}
.btn.danger{background:var(--red50);color:var(--red)}
.btn.lg{height:56px;border-radius:16px;font-size:17px;font-weight:700}
.btn.sm{height:36px;padding:0 12px;border-radius:10px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.tbtn{color:var(--blue);font-weight:600;font-size:15px;padding:6px 8px;border-radius:8px}
.tbtn:hover{background:var(--blue50)}

/* ---------- 입력 ---------- */
.inp{width:100%;height:52px;padding:0 16px;border:0;border-radius:14px;background:var(--g100);font-size:17px;font-weight:500;outline:none;transition:box-shadow .15s,background .15s}
.inp:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--blue)}
.inp::placeholder{color:var(--g400)}
textarea.inp{height:auto;min-height:150px;padding:14px 16px;resize:vertical;line-height:1.6}
.field{display:block;margin-bottom:18px}
.field>span{display:block;font-size:14px;font-weight:600;color:var(--g600);margin:0 0 8px 2px}
.hint{font-size:14px;color:var(--g500);margin-top:6px;line-height:1.5}
.err{color:var(--red);font-size:14px;font-weight:600;min-height:20px;margin:6px 2px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;font-size:16px;font-weight:500;cursor:pointer}
.toggle input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:var(--g300);position:relative;cursor:pointer;flex:0 0 auto;transition:background .2s;margin:0}
.toggle input::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.toggle input:checked{background:var(--blue)}
.toggle input:checked::after{transform:translateX(20px)}
.cbx{display:flex;align-items:center;gap:10px;min-height:44px;font-size:16px;cursor:pointer;padding:0 4px;border-radius:10px}
.cbx:hover{background:var(--g50)}
.cbx input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:8px;background:var(--g200);margin:0;flex:0 0 auto;display:grid;place-items:center;cursor:pointer;transition:background .15s}
.cbx input::after{content:'';width:10px;height:6px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.cbx input:checked{background:var(--blue)}
.cbx input:checked::after{opacity:1}

/* ---------- 틀 (SaaS 레이아웃) ---------- */
.shell{min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:#fff;border-right:1px solid var(--g100);display:flex;flex-direction:column;padding:24px 14px;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 26px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--blue);display:grid;place-items:center;color:#fff;flex:0 0 auto}
.brand b{font-size:17px;font-weight:800;display:block;line-height:1.25}
.brand small{font-size:12px;color:var(--g500);font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;height:48px;padding:0 12px;border-radius:12px;font-weight:600;color:var(--g600);font-size:16px;text-align:left}
.nav button:hover{background:var(--g50)}
.nav button.on{background:var(--g100);color:var(--g900)}
.nav button svg{width:22px;height:22px;flex:0 0 auto}
.nav button.on svg{color:var(--blue)}
.side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 10px;border-radius:14px;background:var(--g50)}
.me .who{flex:1;min-width:0}
.me .who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who small{font-size:13px;color:var(--g500)}
.main{margin-left:var(--side);padding:32px 40px 80px}
.page{max-width:1120px;margin:0 auto}
.mtop,.tabbar{display:none}
.demo-banner{background:var(--orange50);color:#b25e00;font-size:13px;font-weight:600;padding:8px 14px;border-radius:12px;margin-bottom:18px;text-align:center}

.brandmark{display:inline-flex;align-items:center;height:var(--h)}
.brandmark img{height:100%;width:auto;display:block}
.brandmark b{display:none;color:#1d4f91;font-weight:900;font-size:calc(var(--h) * .72);letter-spacing:.02em;line-height:1}
.brandmark.noimg img{display:none}
.brandmark.noimg b{display:inline}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;flex:0 0 auto;background:var(--blue50);color:var(--blue)}
.avatar.sm{width:36px;height:36px;font-size:14px}

/* ---------- 머리글 ---------- */
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.ph h1{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.3}
.ph .sub{color:var(--g500);font-size:15px;font-weight:500;margin-top:2px}
.ph .sp{flex:1}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.datenav{display:flex;align-items:center;gap:4px}
.datenav .arrow{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--g600)}
.datenav .arrow:hover{background:#fff}
.datenav .arrow svg{width:22px;height:22px}
.datelabel{position:relative;cursor:pointer;padding:2px 6px;border-radius:10px}
.datelabel:hover{background:rgba(255,255,255,.7)}
.datelabel input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.today-chip{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:99px;background:var(--blue50);color:var(--blue);font-size:13px;font-weight:700;margin-left:6px;vertical-align:middle}

/* ---------- 카드 · 리스트 ---------- */
.card{background:var(--card);border-radius:var(--r-card);padding:24px;margin-bottom:16px}
.card.flush{padding:8px 0}
.card-h{display:flex;align-items:center;gap:8px;padding:0 0 14px}
.card.flush .card-h{padding:16px 24px 8px}
.card-h h2{font-size:20px;font-weight:700;letter-spacing:-.03em}
.card-h .note{font-size:14px;color:var(--g500);font-weight:500}
.card-h .sp{flex:1}
.row{display:flex;align-items:center;gap:14px;padding:14px 24px;min-height:68px;transition:background .12s}
.row.click{cursor:pointer}
.row.click:hover{background:var(--g50)}
.row.click:active{background:var(--g100)}
.row .mid{flex:1;min-width:0}
.row .t{font-size:17px;font-weight:600;line-height:1.35}
.row .d{font-size:14px;color:var(--g500);margin-top:3px;line-height:1.45}
.row .end{text-align:right;flex:0 0 auto}
.row .end b{font-size:18px;font-weight:700}
.row .end span{font-size:14px;color:var(--g500);font-weight:500}
.row .chev{color:var(--g300);width:20px;height:20px;flex:0 0 auto}
.row.child{padding-left:44px}
.row.group .t{font-weight:700}
.divider{height:1px;background:var(--g100);margin:6px 24px}
.sechead{font-size:14px;font-weight:600;color:var(--g500);padding:14px 24px 4px}
.empty{padding:28px 24px;text-align:center;color:var(--g500);font-size:15px}

.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:700;vertical-align:1px}
.badge.todo{background:var(--orange50);color:#e07b00}
.badge.done{background:var(--green50);color:var(--green)}
.badge.blue{background:var(--blue50);color:var(--blue)}
.badge.grey{background:var(--g100);color:var(--g600)}
.badge.red{background:var(--red50);color:var(--red)}
.lost{color:var(--red)}

.pill{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:7px;font-size:13px;font-weight:600;line-height:1.5;white-space:nowrap}
.pill em{font-style:normal;font-weight:500;opacity:.8}
.pill.trip{background:var(--trip50);color:var(--trip)}
.pill.hq{background:var(--hq50);color:var(--hq)}
.pill.edu{background:var(--edu50);color:var(--edu)}
.pill.leave{background:var(--leave50);color:var(--leave)}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}

/* ---------- 요약 ---------- */
.hero{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:16px;margin-bottom:16px}
.hero .card{margin:0}
.stat .k{font-size:15px;color:var(--g600);font-weight:600;display:flex;align-items:center;gap:6px}
.stat .v{font-size:34px;font-weight:800;letter-spacing:-.04em;margin-top:6px;line-height:1.2}
.stat .v small{font-size:18px;color:var(--g400);font-weight:600;margin-left:3px}
.stat .s{font-size:14px;color:var(--g500);margin-top:4px}
.bar{height:8px;border-radius:99px;background:var(--g100);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .4s}
.bar.green i{background:var(--green)}
.catline{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.catline span{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:10px;background:var(--g50);font-size:14px;font-weight:600;color:var(--g700)}
.catline i{width:8px;height:8px;border-radius:50%}
.catline b{font-weight:700;color:var(--g900)}
.cta{display:flex;align-items:center;gap:12px;background:var(--blue50);border-radius:16px;padding:14px 16px;margin-top:14px}
.cta p{flex:1;font-size:14px;color:var(--g700);font-weight:500}
.cta p b{color:var(--blue)}

.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.etc-list{margin:0;padding:0 24px 8px 44px;font-size:16px;line-height:1.9;color:var(--g800)}
.meta{font-size:13px;color:var(--g400);padding:4px 24px 12px}

/* ---------- 시트 (아래서 올라오는 창) ---------- */
.overlay{position:fixed;inset:0;background:var(--dim);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .18s ease}
.sheet{background:#fff;border-radius:28px;width:100%;max-width:560px;max-height:calc(100vh - 48px);display:flex;flex-direction:column;animation:pop .22s cubic-bezier(.2,.9,.3,1.1)}
.sheet.wide{max-width:680px}
.sheet .grab{display:none}
.sheet-h{padding:26px 26px 10px;display:flex;align-items:flex-start;gap:12px}
.sheet-h h3{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.35}
.sheet-h p{font-size:15px;color:var(--g500);margin-top:2px}
.sheet-h .x{margin-left:auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--g500);flex:0 0 auto}
.sheet-h .x:hover{background:var(--g100)}
.sheet-b{padding:10px 26px 12px;overflow-y:auto;flex:1}
.sheet-f{padding:12px 26px 26px;display:flex;gap:8px}
.sheet-f .btn{flex:1}
.sheet-f .btn.grey{flex:0 0 auto;min-width:96px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}}
@keyframes up{from{transform:translateY(100%)}}

.stepper{display:flex;align-items:center;gap:6px;background:var(--g100);border-radius:16px;padding:4px}
.stepper button{width:48px;height:48px;border-radius:12px;font-size:24px;font-weight:600;color:var(--g700)}
.stepper button:hover{background:#fff}
.stepper input{width:64px;text-align:center;font-size:22px;font-weight:800;border:0;background:transparent;outline:none;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.totalrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.totalrow b{font-size:17px}
.calc{border-radius:18px;background:var(--g50);padding:18px 20px;margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.calc .k{font-size:15px;color:var(--g600);font-weight:600}
.calc .v{font-size:30px;font-weight:800;letter-spacing:-.03em}
.calc .v small{font-size:16px;color:var(--g400);font-weight:600}
.calc .f{font-size:13px;color:var(--g500);text-align:right}
.cat{padding:16px 0;border-top:1px solid var(--g100)}
.cat-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cat-h .dot{width:10px;height:10px;border-radius:50%}
.cat-h h4{font-size:17px;font-weight:700}
.cat-h small{color:var(--g500);font-size:13px;font-weight:500}
.cat-h .cnt{margin-left:auto;font-weight:700;color:var(--g600);font-size:15px}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people:not(:empty){margin-bottom:10px}
.people .pill{font-size:15px;padding:6px 6px 6px 12px;border-radius:10px;gap:6px}
.people .pill button{width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.08);color:inherit;font-size:14px;line-height:1;display:grid;place-items:center}
.add{display:grid;grid-template-columns:1fr 1.25fr auto;gap:6px}
.add .inp{height:46px;font-size:16px;border-radius:12px}
.add .btn{height:46px;border-radius:12px;padding:0 16px}

.plist .prow{display:grid;grid-template-columns:1fr 96px 96px;gap:8px;align-items:center;padding:6px 0}
.plist .ph2{font-size:13px;color:var(--g500);font-weight:600;text-align:center}
.plist .n{font-weight:600;font-size:16px}
.plist .inp{text-align:center;font-weight:700;height:48px;padding:0 8px}
.plist .sum{border-top:1px solid var(--g100);margin-top:8px;padding-top:12px;font-weight:800}
.plist .sum div{text-align:center;font-size:18px}
.plist .sum .n{text-align:left;font-size:16px}

/* ---------- 로그인 ---------- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 20px;background:#fff}
.login-in{width:100%;max-width:400px}
.login .logo{width:48px;height:48px;border-radius:15px;margin-bottom:28px}
.login h1{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.35;margin-bottom:8px}
.login .sub{color:var(--g500);font-size:16px;margin-bottom:36px}
.uline{width:100%;border:0;border-bottom:2px solid var(--g200);padding:12px 2px;font-size:22px;font-weight:600;outline:none;background:transparent;transition:border-color .2s;border-radius:0}
.uline:focus{border-color:var(--blue)}
.uline::placeholder{color:var(--g300)}
.dots{display:flex;gap:14px;justify-content:center;margin:12px 0 8px;min-height:20px}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--g200);transition:background .15s,transform .15s}
.dots i.on{background:var(--blue);transform:scale(1.08)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:24px 0 16px}
.keypad button{height:64px;border-radius:16px;font-size:26px;font-weight:600;color:var(--g800)}
.keypad button:hover{background:var(--g50)}
.keypad button:active{background:var(--g100);transform:scale(.96)}
.keypad button.fn{font-size:15px;color:var(--g600)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.demo-note{margin-top:22px;padding:14px 16px;border-radius:14px;background:var(--g50);color:var(--g600);font-size:14px;line-height:1.6}
.demo-note b{color:var(--g900)}
.backlink{display:inline-flex;align-items:center;gap:4px;color:var(--g500);font-weight:600;font-size:15px;margin-bottom:22px}

/* ---------- 통계 ---------- */
.seg{display:inline-flex;background:#e9ecef;border-radius:14px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{height:38px;padding:0 14px;border-radius:10px;font-weight:600;font-size:15px;color:var(--g600)}
.seg button.on{background:#fff;color:var(--g900);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.rangebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.rangebar .dates{display:flex;align-items:center;gap:6px}
.rangebar .dates .inp{height:42px;width:auto;font-size:15px;background:#fff}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.four .card{margin:0;padding:20px}
.four .stat .v{font-size:28px}
.rate{display:flex;align-items:center;gap:10px;min-width:130px}
.rate .bar{margin:0;flex:1;height:6px}
.rate span{font-size:14px;font-weight:700;width:48px;text-align:right}
.pdates{padding:0 24px 14px 78px;font-size:13px;color:var(--g500);line-height:1.7}

/* ---------- 관리 ---------- */
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.roles label{border-radius:16px;padding:14px;cursor:pointer;background:var(--g50);box-shadow:inset 0 0 0 1.5px transparent;transition:all .15s}
.roles label b{display:block;font-size:16px;margin-bottom:2px}
.roles label span{font-size:13px;color:var(--g500)}
.roles label:has(input:checked){background:var(--blue50);box-shadow:inset 0 0 0 1.5px var(--blue)}
.roles label:has(input:checked) b{color:var(--blue)}
.roles input{position:absolute;opacity:0;pointer-events:none}
.scope{background:var(--g50);border-radius:16px;padding:10px 12px;max-height:320px;overflow:auto}
.scope h5{margin:10px 4px 2px;font-size:13px;color:var(--g500);display:flex;align-items:center;gap:6px}
.scope h5:first-child{margin-top:2px}
.scope .grid2{display:grid;grid-template-columns:1fr 1fr}
.ord{display:flex;flex-direction:column;gap:2px}
.ord button{width:30px;height:22px;border-radius:6px;color:var(--g400);display:grid;place-items:center}
.ord button:hover{background:var(--g100);color:var(--g700)}
.ord button[disabled]{opacity:.25;pointer-events:none}
.ord svg{width:16px;height:16px}

/* ---------- 알림 ---------- */
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:rgba(25,31,40,.94);color:#fff;padding:14px 22px;border-radius:16px;font-weight:600;font-size:15px;z-index:200;max-width:calc(100% - 32px);text-align:center;animation:pop .2s ease;backdrop-filter:blur(8px)}
.toast.bad{background:var(--red)}
.busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:300;overflow:hidden;background:transparent}
.busy::after{content:'';position:absolute;inset:0;width:40%;background:var(--blue);animation:load 1s ease-in-out infinite;border-radius:99px}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

/* 인쇄용 표 (화면에서는 숨김) */
.print-sheet{display:none}

/* ---------- 반응형 ---------- */
@media (max-width:1180px){
  .layout{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr 1fr}
  .hero .card:first-child{grid-column:1/-1}
  .main{padding:28px 24px 80px}
}
@media (max-width:860px){
  .side{display:none}
  .main{margin-left:0;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:var(--bg);margin:0 -16px;padding:calc(12px + env(safe-area-inset-top,0px)) 20px 10px}
  .mtop b{flex:1;font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mtop .logo{width:30px;height:30px;border-radius:9px}
  .tabbar{display:grid;grid-template-columns:repeat(var(--n,4),1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--g100);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--g400)}
  .tabbar button svg{width:24px;height:24px}
  .tabbar button.on{color:var(--g900)}
  .ph{margin:8px 0 18px}
  .ph h1{font-size:24px}
  .ph .acts{width:100%}
  .hero,.four{grid-template-columns:1fr 1fr;gap:10px}
  .four .card,.hero .card{padding:18px}
  .stat .v{font-size:28px}
  .card{padding:20px;border-radius:22px;margin-bottom:12px}
  .card.flush{padding:6px 0}
  .card.flush .card-h{padding:14px 20px 6px}
  .row{padding:13px 20px}
  .row.child{padding-left:36px}
  .divider{margin:6px 20px}
  .etc-list{padding-left:40px}
  .overlay{align-items:flex-end;padding:0}
  .sheet,.sheet.wide{max-width:none;border-radius:28px 28px 0 0;max-height:94vh;animation:up .28s cubic-bezier(.2,.9,.3,1)}
  .sheet .grab{display:block;width:40px;height:5px;border-radius:99px;background:var(--g200);margin:10px auto 0}
  .sheet-h{padding:16px 22px 8px}
  .sheet-b{padding:8px 22px 10px}
  .sheet-f{padding:10px 22px calc(16px + env(safe-area-inset-bottom,0px))}
  .add{grid-template-columns:1fr 1fr}
  .add .btn{grid-column:1/-1}
  .plist .prow{grid-template-columns:1fr 80px 80px}
  .roles{grid-template-columns:1fr}
  .scope .grid2{grid-template-columns:1fr}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .pdates{padding-left:70px}
}

/* ---------- 인쇄 : 기존 엑셀 양식 ---------- */
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff}
  .shell>*:not(.main),.main>*:not(.page),.page>*:not(.print-sheet),.toast,.busy,.overlay{display:none!important}
  .main{margin:0;padding:0}
  .print-sheet{display:block;color:#000;font-size:10pt;letter-spacing:0}
  .print-sheet h1{text-align:center;font-size:18pt;font-weight:800;margin-bottom:2mm}
  .print-sheet .d{text-align:right;font-weight:700;margin-bottom:2mm}
  .print-sheet .wrap{display:grid;grid-template-columns:1fr 62mm;gap:4mm;align-items:start}
  .print-sheet table{width:100%;border-collapse:collapse}
  .print-sheet th,.print-sheet td{border:1px solid #000;padding:3px 5px;vertical-align:middle}
  .print-sheet th{background:#dde6f0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-sheet caption{text-align:left;font-weight:800;font-size:12pt;padding-bottom:1mm}
  .print-sheet td.c{text-align:center}
  .print-sheet td.b{font-weight:700}
  .print-sheet td.in{padding-left:14px}
  .print-sheet tr.sum td{background:#fff200;font-weight:800;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-sheet .etc{border:1px solid #000;margin-top:4mm;padding:3mm 4mm}
  .print-sheet .etc b{display:block;margin-bottom:1mm}
  .print-sheet .etc ol{margin:0;padding-left:6mm;line-height:1.7}
}
