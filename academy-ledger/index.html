<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101013" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="책먹는미술관 장부">
<link rel="icon" type="image/png" href="./assets/favicon.png">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<meta name="referrer" content="no-referrer">
<title>미술학원 통장장부</title>
<meta name="description" content="농협 거래내역 스크린샷을 올리면 Claude가 읽어 자동으로 분류하고 월별 손익을 분석하는 학원 장부">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f6;
  --card:#ffffff;
  --fill:#f2f4f6;
  --fill-2:#e5e8eb;
  --t1:#191f28;
  --t2:#4e5968;
  --t3:#8b95a1;
  --t4:#b0b8c1;
  --line:#f2f4f6;
  --blue:#3182f6;
  --blue-press:#1b64da;
  --blue-soft:#e8f3ff;
  --blue-ink:#1b64da;
  --in:#3182f6;
  --out:#f5792a;
  --red:#f04452;
  --red-soft:#ffeeee;
  --green:#03b26c;
  --green-soft:#e5f8ef;
  --orange:#fe9800;
  --orange-soft:#fff3e0;
  --dim:rgba(0,0,0,.45);
  --on-blue:#ffffff;
  --nav:rgba(255,255,255,.94);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101013;--card:#1d1d22;--fill:#2c2c35;--fill-2:#3c3c47;
    --t1:#f4f4f6;--t2:#c3c3c6;--t3:#8d8d97;--t4:#62626d;--line:#26262d;
    --blue:#3b8af7;--blue-press:#2272eb;--blue-soft:#1a2b45;--blue-ink:#6aa8ff;
    --in:#3b8af7;--out:#d9621f;--red:#fa616d;--red-soft:#3b1d21;--green:#1fc47f;--green-soft:#14332a;--orange:#ffa927;--orange-soft:#3a2c14;
    --dim:rgba(0,0,0,.6);--nav:rgba(29,29,34,.94);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101013;--card:#1d1d22;--fill:#2c2c35;--fill-2:#3c3c47;
  --t1:#f4f4f6;--t2:#c3c3c6;--t3:#8d8d97;--t4:#62626d;--line:#26262d;
  --blue:#3b8af7;--blue-press:#2272eb;--blue-soft:#1a2b45;--blue-ink:#6aa8ff;
  --in:#3b8af7;--out:#d9621f;--red:#fa616d;--red-soft:#3b1d21;--green:#1fc47f;--green-soft:#14332a;--orange:#ffa927;--orange-soft:#3a2c14;
  --dim:rgba(0,0,0,.6);--nav:rgba(29,29,34,.94);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;font-size:16px;line-height:1.5;letter-spacing:-.01em;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.press{transition:transform .12s ease,background-color .12s}
.press:active{transform:scale(.98)}

/* app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:14px 20px 10px}
.appbar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.appbar h1{font-size:20px;font-weight:700}
.brand{display:flex;align-items:center;gap:8px}
.brand img{height:48px;width:auto;display:block}
.brand span{font-size:17px;color:var(--t2)}
.sync{font-size:12px;color:var(--t3);display:flex;align-items:center;gap:6px;background:var(--card);padding:5px 10px;border-radius:999px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--t4)}
.sync.ok i{background:var(--green)}
.sync.local i{background:var(--orange)}

/* month switcher */
.monthrow{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 14px}
.month-btn{font-size:24px;font-weight:700;display:flex;align-items:center;gap:6px}
.month-btn svg{width:20px;height:20px;color:var(--t3)}
.arrows{display:flex;gap:6px}
.arrow{width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--t2)}
.arrow:disabled{opacity:.3;cursor:default}
.arrow svg{width:18px;height:18px}

main{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:24px;padding:24px 20px}
.card-title{font-size:19px;font-weight:700;margin-bottom:4px}
.card-sub{font-size:14px;color:var(--t3)}
.card-head{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:16px}
.label{font-size:14px;color:var(--t3);font-weight:500}

/* hero */
.hero .label{font-size:15px}
.hero .big{font-size:32px;font-weight:800;letter-spacing:-.03em;margin-top:2px;line-height:1.25}
.hero .big.neg{color:var(--red)}
.hero .caption{font-size:15px;color:var(--t2);margin-top:6px}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:18px;gap:2px;background:var(--fill)}
.split span{display:block;height:100%}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.duo > div{background:var(--fill);border-radius:16px;padding:14px}
.duo .v{font-size:18px;font-weight:700;margin-top:2px}
.duo .d{font-size:13px;margin-top:2px;color:var(--t3)}
.up{color:var(--red)}.down{color:var(--blue-ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* list rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;width:100%;text-align:left}
.row .ic{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700}
.row .mid{flex:1;min-width:0}
.row .t{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--t3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{text-align:right;flex:none}
.row .a{font-size:16px;font-weight:600}
.row .a.in{color:var(--blue-ink)}
.row .rs{font-size:13px;color:var(--t3);margin-top:1px}
.row.off{opacity:.4}
.group-label{font-size:13px;color:var(--t3);font-weight:600;padding:18px 0 4px;display:flex;justify-content:space-between}
.group-label:first-child{padding-top:0}
.ic.fixed{background:var(--blue-soft);color:var(--blue-ink)}
.ic.var{background:var(--orange-soft);color:var(--orange)}
.ic.etc{background:var(--fill);color:var(--t2)}
.ic.inc{background:var(--blue-soft);color:var(--blue-ink)}
.ic.good{background:var(--green-soft);color:var(--green)}
.ic.bad{background:var(--red-soft);color:var(--red)}
.ic.wait{background:var(--fill);color:var(--t3)}
.ic svg{width:20px;height:20px}
.meter{height:4px;border-radius:2px;background:var(--fill);margin-top:6px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--out);border-radius:2px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;vertical-align:1px}
.tag.warn{background:var(--orange-soft);color:var(--orange)}
.tag.blue{background:var(--blue-soft);color:var(--blue-ink)}
.tag.gray{background:var(--fill);color:var(--t2)}
.tag.red{background:var(--red-soft);color:var(--red)}
.more{width:100%;margin-top:8px;padding:12px;border-radius:14px;background:var(--fill);color:var(--t2);font-size:15px;font-weight:600}

/* students */
.kv{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:16px}
.kv .k{color:var(--t2)}
.kv .v{font-weight:600}
.stu-in{width:84px;text-align:right;border:0;background:var(--fill);border-radius:10px;padding:6px 10px;font-weight:600}
.callout{margin-top:10px;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600}
.callout.red{background:var(--red-soft);color:var(--red)}
.callout.green{background:var(--green-soft);color:var(--green)}
.callout.gray{background:var(--fill);color:var(--t2);font-weight:500}

/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:14px;font-size:13px;color:var(--t2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tip{position:absolute;pointer-events:none;background:var(--t1);color:var(--card);font-size:13px;padding:8px 12px;border-radius:12px;white-space:nowrap;transform:translate(-50%,-100%);line-height:1.55;z-index:3}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:56px;border-radius:16px;background:var(--blue);color:var(--on-blue);font-size:17px;font-weight:600}
.btn:active{background:var(--blue-press)}
.btn:disabled{background:var(--fill-2);color:var(--t4);cursor:default;transform:none}
.btn.sub{background:var(--blue-soft);color:var(--blue-ink)}
.btn.gray{background:var(--fill);color:var(--t2)}
.btn.red{background:var(--red);color:#fff}
.btn.red:active{background:var(--red)}
.btn.sm{height:44px;border-radius:12px;font-size:15px;width:auto;padding:0 16px}
.btns{display:flex;gap:8px}
.btns .btn.gray{flex:0 0 34%}
.cta{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:5;padding-top:12px;background:linear-gradient(to bottom,transparent,var(--bg) 30%)}

/* upload */
.hello{padding:8px 4px 16px}
.hello h2{font-size:24px;font-weight:700;line-height:1.35;text-wrap:balance}
.hello p{font-size:15px;color:var(--t2);margin-top:8px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--card);border-radius:24px;padding:36px 20px;text-align:center;border:2px dashed transparent;cursor:pointer}
.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop .plus{width:56px;height:56px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.drop .plus svg{width:26px;height:26px}
.drop b{font-size:17px}
.drop span{font-size:14px;color:var(--t3)}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 2px;margin-top:4px;max-width:100%}
.thumbs div{position:relative;flex:none}
.thumbs img{width:72px;height:128px;object-fit:cover;object-position:top;border-radius:12px;display:block;background:var(--fill)}
.thumbs button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;text-align:center}
.steps{display:flex;flex-direction:column;gap:14px}
.steps div{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--t2)}
.steps .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--blue-soft);color:var(--blue-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
.steps span b{color:var(--t1);font-weight:700}
.notice{border-radius:16px;padding:14px 16px;font-size:15px;background:var(--card);color:var(--t2);display:flex;gap:10px;align-items:center}
.notice.err{background:var(--red-soft);color:var(--red)}
.notice .spin{flex:none;width:18px;height:18px;border-radius:50%;border:2.5px solid var(--blue-soft);border-top-color:var(--blue);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.check{flex:none;width:26px;height:26px;border-radius:50%;background:var(--fill-2);display:grid;place-items:center;color:#fff}
.check.on{background:var(--blue)}
.check svg{width:16px;height:16px}

/* segmented / search */
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--fill);border-radius:12px;padding:3px;gap:2px}
.seg.two{grid-template-columns:1fr 1fr}
.seg button{padding:7px 0;border-radius:10px;font-size:14px;font-weight:600;color:var(--t3)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--t1);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.search{width:100%;border:0;background:var(--fill);border-radius:12px;padding:11px 14px;font-size:15px;margin-top:10px}
.search::placeholder{color:var(--t4)}
.totals{display:flex;gap:16px;font-size:14px;color:var(--t2);margin-top:14px}
.totals b{font-weight:700}
.empty{padding:32px 0;text-align:center;color:var(--t3);font-size:15px}

/* settings */
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0}
.field input,.field select{border:0;background:var(--fill);border-radius:12px;padding:10px 12px;font-size:16px;font-weight:600;text-align:right;width:140px;min-width:0}
.field select{text-align:left;width:auto}
.rulelist{max-height:380px;overflow:auto;margin-top:6px}
.ins-points{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.ins-points li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.55;color:var(--t1)}
.ins-points .ic{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-grid > div{background:var(--fill);border-radius:16px;padding:14px}
.stat-grid .v{font-size:18px;font-weight:700;margin-top:2px}
.stat-grid .d{font-size:12px;color:var(--t3);margin-top:2px}
.tbl-wrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
.tbl{border-collapse:collapse;font-size:13px;min-width:100%}
.tbl th,.tbl td{padding:8px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl th{font-weight:600;color:var(--t3);font-size:12px}
.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
.tbl tr.sum td{font-weight:700;border-top:2px solid var(--fill-2)}
.tbl td.neg{color:var(--red)}
.sumtbl td,.sumtbl th{padding:7px 10px}
.sumtbl tr.top td{font-weight:700;background:var(--fill);border-bottom:1px solid var(--fill-2)}
.sumtbl tr.top td:first-child{background:var(--fill)}
.sumtbl tr.top.in td{color:var(--blue-ink)}
.sumtbl tr.grp td{font-weight:700}
.sumtbl tr.det td{color:var(--t2)}
.sumtbl tr.rate td,.sumtbl tr.ref td{color:var(--t3);font-size:12px}
.sumtbl .ind{padding-left:14px;font-weight:500}
.sumtbl tr.net td{border-top:2px solid var(--fill-2)}
.cv{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:4px;vertical-align:1px}
.cv.hi{background:var(--orange-soft);color:var(--orange)}
.cv.lo{background:var(--green-soft);color:var(--green)}
.ai{white-space:pre-wrap;font-size:15px;line-height:1.75;color:var(--t1);margin-bottom:16px}
.ai.muted{color:var(--t3)}
.ai-card{background:linear-gradient(160deg,var(--blue-soft),var(--card) 55%)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--nav);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:11px;font-weight:600;color:var(--t4)}
.nav button svg{width:24px;height:24px}
.nav button[aria-selected="true"]{color:var(--t1)}

/* bottom sheet */
.dim{position:fixed;inset:0;background:var(--dim);z-index:40;opacity:0;transition:opacity .2s}
.dim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:24px 24px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:86vh;overflow:auto;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}
.sheet.show{transform:none}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--fill-2);margin:0 auto 18px}
.sheet h3{font-size:20px;font-weight:700;line-height:1.35}
.sheet .sub{font-size:15px;color:var(--t3);margin-top:4px}
.sheet .amt{font-size:28px;font-weight:800;margin-top:14px;letter-spacing:-.02em}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.catgrid button{padding:13px 4px;border-radius:14px;background:var(--fill);font-size:15px;font-weight:600;color:var(--t2)}
.catgrid button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}
.catgrid-label{font-size:13px;color:var(--t3);font-weight:600;margin-top:14px}
.catgrid-label + .catgrid{margin-top:8px}
.sheet .form{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.sheet .form label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--t3);font-weight:600}
.sheet .form input,.sheet .form select{border:0;background:var(--fill);border-radius:12px;padding:13px 14px;font-size:16px;color:var(--t1);min-width:0;width:100%}
.monthlist .row{padding:14px 4px;border-radius:12px}
.monthlist .row[aria-current="true"] .t{color:var(--blue-ink)}
.linkbtn{color:var(--red);font-size:15px;font-weight:600;padding:12px;width:100%;text-align:center;margin-top:6px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(25,31,40,.92);color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;font-weight:500;z-index:60;max-width:calc(100% - 32px);text-align:center}
/* PC: 넓은 화면은 왼쪽 세로 메뉴 + 2단 카드 */
@media (min-width: 1024px){
  body{padding-left:252px;padding-right:32px;padding-bottom:40px}
  .appbar{margin-left:-16px;margin-right:-32px;padding:18px 32px 12px}
  .wrap,.appbar-in{max-width:1180px}
  .nav{top:0;bottom:0;right:auto;width:220px;border-top:0;border-right:1px solid var(--line);background:var(--card);padding:96px 12px 24px}
  .nav-in{display:flex;flex-direction:column;gap:4px;max-width:none}
  .nav button{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;border-radius:12px;font-size:15px;color:var(--t3)}
  .nav button[aria-selected="true"]{background:var(--fill);color:var(--t1)}
  .nav button:hover{background:var(--fill)}
  #view-dash,#view-insights,#view-settings,#view-upload{display:block;columns:2;column-gap:16px}
  #view-dash > *,#view-insights > *,#view-settings > *,#view-upload > *{break-inside:avoid;margin:0 0 16px}
  .span2,main > .hello,main > .cta,main > .notice{column-span:all}
  #view-list{max-width:860px;margin:0 auto}
  .cta{bottom:16px}
  .toast{bottom:28px;left:calc(50% + 110px)}
  .sheet{left:220px;max-width:640px}
  .hero .big{font-size:36px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="appbar">
  <div class="appbar-in">
    <h1 class="brand"><img src="./assets/logo.png" alt="책먹는미술관 장부" width="93" height="48"></h1>
    <span class="sync" id="store"><i></i><span>연결 중</span></span>
  </div>
</header>

<div class="wrap">
  <div class="monthrow" id="monthrow">

let db = null, sample = null, downloads = null, imgLimits = null;

/* ───────── 유틸 ───────── */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const won = n => (n < 0 ? '-' : '') + Math.abs(Math.round(n)).toLocaleString('ko-KR') + '원';
const signed = (dir, n) => (dir === 'in' ? '+' : '-') + Math.abs(Math.round(n)).toLocaleString('ko-KR') + '원';
const man = n => {
  const a = Math.abs(n);
  if (a >= 1e8) return (n / 1e8).toFixed(1).replace(/\.0$/, '') + '억';
  if (a >= 1e4) return Math.round(n / 1e4).toLocaleString('ko-KR') + '만';

const normName = s => String(s || '').replace(/\s+/g, '');
const mLabel = m => { const [y, mo] = m.split('-'); return `${y}년 ${+mo}월`; };
const shiftMonth = (m, d) => { let [y, mo] = m.split('-').map(Number); mo += d; while (mo < 1) { mo += 12; y--; } while (mo > 12) { mo -= 12; y++; } return `${y}-${String(mo).padStart(2, '0')}`; };
const today = new Date();
const thisMonth = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const dayLabel = d => { const [y, m, dd] = d.split('-').map(Number); return `${m}월 ${dd}일 ${WD[new Date(y, m - 1, dd).getDay()]}요일`; };
function hash(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(36); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2400); }
const isExpense = t => t.dir === 'out' && t.cat !== '통장이동';
const ICON = {

// 원장님이 설정에서 넣은 '이 글자가 들어가면 이 항목' 규칙. 출금 항목은 출금에만,
// 수입 항목은 입금에만, 통장이동은 양쪽에 적용한다.
function kwMatch(dir, name) {
  const n = normName(name).toUpperCase();
  for (const r of S.config.kwRules || []) {
    const kw = normName(r.kw).toUpperCase();
    if (!kw || !n.includes(kw)) continue;
    if (r.cat === '통장이동' || (dir === 'in' ? IN_CATS : OUT_CATS).includes(r.cat)) return r.cat;
  }
  return null;
}
// 순서: 글자 규칙 → 직접 정한 거래처 → 메모(예: '보험료') → 거래처 이름 키워드 → '기타'로 기억한 거래처
function classify(dir, name, memo) {
  const kw = kwMatch(dir, name);
  if (kw) return { cat: kw, how: 'rule' };
  const key = normName(name);
  const r = S.config.rules?.[dir]?.[key];
  if (r && r !== '기타') return { cat: r, how: 'rule' };
  const mc = dir === 'out' ? memoCat(memo) : null;
  if (mc) return { cat: mc, how: 'keyword' };
  const k = dir === 'out' ? keywordCat(key) : null;
  if (k) return { cat: k, how: 'keyword' };
  if (r) return { cat: r, how: 'rule' };
  return null;
}
// 은행 거래내용·메모에 적힌 말로 분류 (거래처 이름이 '신한2606-009'처럼 매달 바뀌는 경우)
const MEMO_HINTS = [
  [/대출/, '대출이자'],
  [/건강보험|국민연금|고용보험|산재보험|국세|지방세|세금/, '세금'],
  [/보험/, '보험'],
  [/관리비/, '관리비'],
  [/월세|임대료/, '월세'],
  [/급여|월급/, '월급'],
  [/렌트카|렌터카/, '렌트카'],
  [/렌탈/, '렌탈'],
  [/주유/, '주유비'],
];
function memoCat(memo) {
  const m = normName(memo);
  if (!m) return null;
  for (const [re, cat] of MEMO_HINTS) if (re.test(m)) return cat;
  return null;
}
function keywordCat(name) {
  const key = normName(name);
  for (const [re, cat] of KEYWORDS) if (re.test(key)) return cat;
  return null;
}

// 한 번만 실행하는 장부 정리. 이름을 config.migrations에 기록해 다시 돌지 않게 한다.
// 각 정리는 '기타'로 들어가 있는 출금(글자 규칙에 안 걸린 것)만 다시 분류한다.
const MIGRATIONS = [
  // 식당·편의점·주유소 이름이면 식대/주유비
  { id: 'food-fuel-202610', label: '식당·편의점·주유소', pick: t => keywordCat(t.name) },
  // 메모에 '보험료' 등이 적혀 있으면 그 항목
  { id: 'memo-hints-202610', label: '메모(보험료 등)', pick: t => memoCat(t.memo) },
  // 거래처나 메모에 '대출'이 있으면 대출이자
  { id: 'loan-202610', label: '대출', pick: t => (/대출/.test(normName(t.name) + normName(t.memo)) ? '대출이자' : null) },
];
async function runMigrations() {
  const done = S.config.migrations || [];
  const todo = MIGRATIONS.filter(m => !done.includes(m.id));
  if (!todo.length) return;
  const touched = new Set();
  const counts = {};
  for (const m of Object.keys(S.months)) {
    for (const t of S.months[m]) {
      if (t.dir !== 'out' || t.cat !== '기타' || kwMatch('out', t.name)) continue;
      for (const mg of todo) {
        const c = mg.pick(t);
        if (c && c !== '기타') { t.cat = c; counts[mg.label] = (counts[mg.label] || 0) + 1; touched.add(m); break; }
      }
    }
  }
  // '기타'로 기억해 둔 거래처 중 식당·주유소 키워드에 맞는 건 규칙에서 지운다
  for (const [k, c] of Object.entries(S.config.rules?.out || {})) if (c === '기타' && keywordCat(k)) delete S.config.rules.out[k];
  S.config.migrations = [...new Set([...done, ...todo.map(m => m.id)])];
  for (const m of touched) await saveMonth(m);
  await saveConfig();
  const n = Object.values(counts).reduce((a, b) => a + b, 0);
  if (n) toast(`${Object.keys(counts).join(', ')} 기준으로 '기타' 거래 ${n}건을 다시 분류했어요`);
  render();
}

// 휴대폰 캡처(1080x2400 등)를 긴 변 1800px JPEG로 줄여 전송량과 비용을 줄인다
async function prepImage(file) {
  let blob = file;
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9)) || file;
  } catch (e) {}
  const data = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(blob); });
  return { type: blob.type || 'image/jpeg', data };
}

let AnthropicSDK = null;
async function anthropicClient() {
  if (!AnthropicSDK) {
    try { AnthropicSDK = (await import(SDK_URL)).default; }
    catch (e) { throw new AIError('sdk_missing', 'Anthropic SDK 파일을 불러오지 못했어요. vendor 폴더가 함께 배포됐는지 확인해주세요.'); }
  }
  // 개인용 앱이라 키를 브라우저에서 직접 쓴다 (키는 이 브라우저에만 저장)
  return new AnthropicSDK({ apiKey: AI.keys.anthropic, dangerouslyAllowBrowser: true, maxRetries: 2 });
}
function anthropicParams(model, content, extra) {
  const p = { model, max_tokens: 16000, messages: [{ role: 'user', content }], ...extra };
  if (/haiku|sonnet-4-5|opus-4-1|claude-3/.test(model)) delete p.output_config?.effort;
  return p;
}
// Claude Opus 5는 안전 분류기가 거절할 때 다른 모델로 이어서 답하도록 서버 측 fallback을 켠다
const wantsFallback = model => model === 'claude-opus-5';
function mapAnthropicError(e) {
  if (e instanceof AIError) return e;
  const A = AnthropicSDK;
  if (A) {
    if (e instanceof A.AuthenticationError) return new AIError('auth', 'API 키가 맞지 않아요. 설정에서 키를 다시 확인해주세요.');
    if (e instanceof A.PermissionDeniedError) return new AIError('auth', '이 키로는 이 모델을 쓸 수 없어요. 설정에서 모델이나 키를 확인해주세요.');
    if (e instanceof A.NotFoundError) return new AIError('model', '모델을 찾을 수 없어요. 설정에서 모델을 다시 골라주세요.');
    if (e instanceof A.RateLimitError) return new AIError('rate_limited', '요청이 많아요. 1~2분 뒤에 다시 눌러주세요.');
    if (e instanceof A.BadRequestError) return new AIError('bad_request', /credit|balance|billing/i.test(e.message) ? 'API 크레딧이 부족해요. Anthropic 콘솔에서 결제 상태를 확인해주세요.' : '요청이 거절됐어요: ' + e.message);
    if (e instanceof A.APIConnectionError) return new AIError('network', '인터넷 연결을 확인해주세요.');
    if (e instanceof A.APIError) return new AIError('upstream', `Claude 서버 오류(${e.status ?? '?'})예요. 잠시 후 다시 해주세요.`);
  }
  return new AIError('upstream', '사진을 읽지 못했어요. 잠시 후 다시 해주세요.');
}

async function geminiFetch(path, body) {
  let r;
  try {
    r = await fetch('https://generativelanguage.googleapis.com/v1beta/' + path, {
      method: body ? 'POST' : 'GET',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': AI.keys.gemini },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) { throw new AIError('network', '인터넷 연결을 확인해주세요.'); }
  const data = await r.json().catch(() => null);
  if (!r.ok) {
    const msg = data?.error?.message || '';
    if (r.status === 400 && /API key|API_KEY/i.test(msg) || r.status === 401 || r.status === 403) throw new AIError('auth', 'API 키가 맞지 않아요. 설정에서 키를 다시 확인해주세요.');
    if (r.status === 404) throw new AIError('model', '모델을 찾을 수 없어요. 설정에서 모델을 다시 골라주세요.');
    if (r.status === 429) throw new AIError('rate_limited', '요청이 많거나 무료 한도를 넘었어요. 잠시 뒤에 다시 눌러주세요.');
    if (r.status === 503 || r.status === 500 || r.status === 502 || r.status === 504) throw new AIError('busy', '지금 Gemini 서버가 붐벼요. 몇 분 뒤에 다시 눌러주세요. (설정 → 사진 읽기 AI에서 다른 모델을 골라도 돼요)');
    throw new AIError('upstream', `Gemini 오류(${r.status})예요. 잠시 후 다시 해주세요.`);
  }
  return data;
}
// 서버가 붐비면(503 등) 잠깐 쉬었다 한 번 더, 그래도 안 되면 다른 Flash 모델로 한 번 더 시도한다
async function geminiGenerate(parts, json) {
  const main = AI.models.gemini || DEFAULT_MODEL.gemini;
  const others = (AI.lists.gemini || []).filter(n => n !== main && /flash/.test(n) && !/lite|image|tts|live/.test(n));
  const tries = [main, main, ...(others.length ? [pickGeminiDefault(others)] : [])];
  let data, lastErr;
  for (let i = 0; i < tries.length; i++) {
    try {
      data = await geminiFetch(`models/${encodeURIComponent(tries[i])}:generateContent`, {
        contents: [{ role: 'user', parts }],
        generationConfig: json ? { responseMimeType: 'application/json' } : {},
      });
      break;
    } catch (e) {
      lastErr = e;
      if (e.code !== 'busy' || i === tries.length - 1) throw e;
      await new Promise(r => setTimeout(r, 1500 * (i + 1)));
    }
  }
  if (!data) throw lastErr;
  const cand = data?.candidates?.[0];
  if (!cand) throw new AIError('refused', 'Gemini가 이 요청에 답하지 않았어요.' + (data?.promptFeedback?.blockReason ? ` (${data.promptFeedback.blockReason})` : ''));
  const text = (cand.content?.parts || []).map(p => p.text || '').join('');
  if (cand.finishReason === 'MAX_TOKENS') throw new AIError('truncated', '거래가 너무 많아 답이 잘렸어요. 캡처를 나눠서 올려주세요.');
  if (!text) throw new AIError('refused', `Gemini가 답하지 않았어요 (${cand.finishReason || '이유 없음'}).`);
  return text;
}
function parseJSONLoose(text) {
  try { return JSON.parse(text); } catch (e) {}
  const m = text.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (m) try { return JSON.parse(m[1]); } catch (e) {}
  const a = text.indexOf('{'), b = text.lastIndexOf('}');
  if (a >= 0 && b > a) try { return JSON.parse(text.slice(a, b + 1)); } catch (e) {}
  throw new AIError('invalid_json', 'AI 답을 해석하지 못했어요. 한 번 더 눌러주세요.');
}

// 캡처 여러 장 → 거래 배열
async function aiExtract(files, prompt) {
  const mode = aiMode();
  if (mode === 'app') {
    const res = await sample.json(prompt, { images: files, modelTier: 'default' });
    return Array.isArray(res) ? res : res?.transactions || [];
  }
  const imgs = await Promise.all(files.map(prepImage));
  if (mode === 'gemini') {
    const text = await geminiGenerate([...imgs.map(i => ({ inlineData: { mimeType: i.type, data: i.data } })), { text: prompt }], true);
    const res = parseJSONLoose(text);
    return Array.isArray(res) ? res : res?.transactions || [];
  }
  if (mode === 'anthropic') {
    try {
      const client = await anthropicClient();
      const model = AI.models.anthropic || DEFAULT_MODEL.anthropic;
      const content = [...imgs.map(i => ({ type: 'image', source: { type: 'base64', media_type: i.type, data: i.data } })), { type: 'text', text: prompt }];
      const params = anthropicParams(model, content, { output_config: { effort: 'medium', format: { type: 'json_schema', schema: TX_SCHEMA } } });
      const res = wantsFallback(model)
        ? await client.beta.messages.create({ ...params, betas: ['server-side-fallback-2026-07-01'], fallbacks: 'default' })
        : await client.messages.create(params);
      if (res.stop_reason === 'refusal') throw new AIError('refused', 'Claude가 이 캡처는 읽을 수 없다고 했어요. 다른 캡처로 해주세요.');
      if (res.stop_reason === 'max_tokens') throw new AIError('truncated', '거래가 너무 많아 답이 잘렸어요. 캡처를 나눠서 올려주세요.');
      const text = res.content.filter(b => b.type === 'text').map(b => b.text).join('');
      return parseJSONLoose(text).transactions || [];
    } catch (e) { throw mapAnthropicError(e); }
  }
  throw new AIError('no_key', '설정에서 API 키를 먼저 넣어주세요.');
}

// 월간 리포트 등 글 답변 (화면에 흘려서 보여줌)
async function aiText(prompt, onText) {
  const mode = aiMode();
  if (mode === 'app' || (!mode && sample)) {
    const { text } = await sample(prompt, { onText: ({ text }) => onText(text) });
    return text;
  }
  if (mode === 'gemini') { const t = await geminiGenerate([{ text: prompt }], false); onText(t); return t; }
  if (mode === 'anthropic') {
    try {
      const client = await anthropicClient();
      const model = AI.models.anthropic || DEFAULT_MODEL.anthropic;
      const params = anthropicParams(model, prompt, { output_config: { effort: 'low' } });
      const stream = wantsFallback(model)
        ? client.beta.messages.stream({ ...params, betas: ['server-side-fallback-2026-07-01'], fallbacks: 'default' })
        : client.messages.stream(params);
      stream.on('text', (_d, snap) => onText(snap));
      const msg = await stream.finalMessage();
      if (msg.stop_reason === 'refusal') throw new AIError('refused', 'Claude가 이 요청에는 답하지 않았어요.');
      return msg.content.filter(b => b.type === 'text').map(b => b.text).join('');
    } catch (e) { throw mapAnthropicError(e); }
  }
  throw new AIError('no_key', '설정에서 API 키를 먼저 넣어주세요.');
}

// 키 확인 겸 쓸 수 있는 모델 목록 가져오기 (토큰을 쓰지 않음)
async function aiListModels(provider) {
  if (provider === 'anthropic') {
    try {
      const client = await anthropicClient();
      const ids = [];
      for await (const m of client.models.list()) ids.push(m.id);
      return ids;
    } catch (e) { throw mapAnthropicError(e); }
  }
  const data = await geminiFetch('models?pageSize=200');
  return (data.models || [])
    .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map(m => m.name.replace(/^models\//, ''))
    .filter(n => /^gemini/.test(n) && !/embedding|tts|image|live|audio|native|robotics/.test(n));
}
function pickGeminiDefault(list) {
  const ver = n => parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/) || [])[1] || 0);
  const stable = list.filter(n => /flash$/.test(n) && !/lite/.test(n));
  const pool = stable.length ? stable : list.filter(n => /flash/.test(n) && !/lite/.test(n));
  return pool.sort((a, b) => ver(b) - ver(a))[0] || list[0] || DEFAULT_MODEL.gemini;
}

  let inc = 0, exp = 0, tuition = 0, moveIn = 0, moveOut = 0, payCnt = 0, cardIn = 0;
  for (const t of items) {
    if (t.dir === 'in') {
      if (t.cat === '통장이동') moveIn += t.amount;
      else {
        inc += t.amount;
        if (t.cat === '수강료') { tuition += t.amount; payCnt += payUnits(t); if (isCardSettle(t)) cardIn += t.amount; }
      }
    } else {
      byCat[t.cat] = (byCat[t.cat] || 0) + t.amount;
      if (t.cat === '통장이동') moveOut += t.amount; else exp += t.amount;
    }
  }
  const groups = EXP_GROUPS.map(g => ({ name: g.name, total: g.cats.reduce((s, c) => s + (byCat[c] || 0), 0) }));
  const withBal = items.filter(t => t.bal != null);
  const lastBal = withBal.length ? withBal.slice().sort((a, b) => a.dt.localeCompare(b.dt)).at(-1).bal : null;
  // 카드 수수료 추정: 정산 입금액은 수수료를 뗀 금액이므로 원래 결제액과의 차이
  const cardFee = cardIn ? Math.round(cardIn / (1 - cardFeeRate()) - cardIn) : 0;
  return { items, inc, exp, net: inc - exp, tuition, payCnt, cardIn, cardFee, moveIn, moveOut, byCat, groups, lastBal, count: items.length };
}

function delta(cur, prev, invert) {
  if (!prev) return '지난달 기록 없음';
  const d = cur - prev;
  if (d === 0) return '지난달과 같아요';
  const good = invert ? d < 0 : d > 0;
  return `지난달보다 <span class="${good ? 'down' : 'up'}">${man(Math.abs(d))}원 ${d > 0 ? '↑' : '↓'}</span>`;
}

/* ───────── 통계 탭: 여러 달을 한눈에 ───────── */
const mean = a => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0);
const stdev = a => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(mean(a.map(x => (x - m) ** 2))); };
// 월 순서(0,1,2…)에 대한 1차 회귀 기울기: 한 달에 평균 얼마씩 늘거나 주는지
const slope = a => { const n = a.length; if (n < 3) return 0; const xm = (n - 1) / 2, ym = mean(a); let num = 0, den = 0; a.forEach((y, i) => { num += (i - xm) * (y - ym); den += (i - xm) ** 2; }); return den ? num / den : 0; };
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
let insMulti = false;   // 통계 기간이 여러 해에 걸치면 '25.3월'처럼 연도를 붙인다
const mShort = m => `${insMulti ? m.slice(2, 4) + '.' : ''}${+m.slice(5)}월`;
// 받침 유무로 조사 고르기: josa('월급', '으로', '로') → '월급으로'
const josa = (w, withB, noB) => { const c = String(w).charCodeAt(String(w).length - 1); const b = c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 !== 0; return w + (b ? withB : noB); };

function rangeMonths() {
  const all = Object.keys(S.months).filter(m => S.months[m]?.length).sort();
  return S.range === 'all' ? all : all.slice(-Number(S.range));
}

function renderInsights() {
  const v = $('#view-insights');
  const ms = rangeMonths();
  const seg = `<div class="seg" style="grid-template-columns:repeat(3,1fr)">${[['6', '최근 6개월'], ['12', '최근 12개월'], ['all', '전체']].map(([k, l]) => `<button data-range="${k}" aria-pressed="${S.range === k}">${l}</button>`).join('')}</div>`;
  if (!ms.length) {
    v.innerHTML = `<div class="hello"><h2>통계</h2></div><section class="card">${seg}<div class="empty">아직 장부에 거래가 없어요</div></section>`;
    return;
  }
  insMulti = ms[0].slice(0, 4) !== ms.at(-1).slice(0, 4);
  const rows = ms.map(m => ({ m, ...stats(m), partial: m === thisMonth }));
  // 진행 중인 이번 달은 평균·추세 계산에서 뺀다 (덜 끝난 달이라 작게 나옴)
  const full = rows.filter(r => !r.partial);
  const base = full.length ? full : rows;
  const tot = { inc: 0, exp: 0, net: 0, tuition: 0 };
  rows.forEach(r => { tot.inc += r.inc; tot.exp += r.exp; tot.net += r.net; tot.tuition += r.tuition; });
  const avgInc = mean(base.map(r => r.inc)), avgExp = mean(base.map(r => r.exp)), avgNet = mean(base.map(r => r.net));
  const plus = rows.filter(r => r.net >= 0).length;
  const losses = rows.filter(r => r.net < 0);
  const best = rows.reduce((a, b) => (b.net > a.net ? b : a)), worst = rows.reduce((a, b) => (b.net < a.net ? b : a));
  const tu = S.config.tuition || 140000;

  // 항목별 합계·월평균·변동성
  const expCats = EXP_GROUPS.flatMap(g => g.cats);
  const catStats = expCats.map(c => {
    const vals = base.map(r => r.byCat[c] || 0);
    const total = rows.reduce((a, r) => a + (r.byCat[c] || 0), 0);
    const avg = mean(vals), sd = stdev(vals);
    const peak = rows.reduce((a, r) => ((r.byCat[c] || 0) > (a.byCat[c] || 0) ? r : a), rows[0]);
    return { c, total, avg, cv: avg ? sd / avg : 0, peak, group: EXP_GROUPS.find(g => g.cats.includes(c)) };
  }).filter(x => x.total > 0).sort((a, b) => b.total - a.total);
  const fixedTotal = rows.reduce((a, r) => a + r.groups.find(g => g.name === '고정지출').total, 0);

  // 핵심 포인트 (규칙으로 자동 생성)
  const pts = [];
  const add = (cls, ic, html) => pts.push(`<li><span class="ic ${cls}">${ic}</span><span>${html}</span></li>`);
  add(avgNet >= 0 ? 'good' : 'bad', '₩', `${rows.length}개월 동안 <b>${man(tot.inc)}원</b> 벌고 <b>${man(tot.exp)}원</b> 써서 <b style="color:${tot.net >= 0 ? 'var(--green)' : 'var(--red)'}">${tot.net >= 0 ? '' : '-'}${man(Math.abs(tot.net))}원</b> ${tot.net >= 0 ? '남았어요' : '모자랐어요'}. 한 달 평균 ${avgNet >= 0 ? '+' : '-'}${man(Math.abs(avgNet))}원이에요.`);
  if (rows.length >= 2) add(losses.length ? 'bad' : 'good', losses.length ? '!' : '✓', losses.length ? `${rows.length}개월 중 <b>${losses.length}개월이 적자</b>였어요: ${losses.map(r => `${mShort(r.m)}(-${man(-r.net)})`).join(', ')}` : `${rows.length}개월 <b>모두 흑자</b>였어요.`);
  if (rows.length >= 2) add('inc', '↑', `가장 많이 남은 달은 <b>${mLabel(best.m)}</b>(${best.net >= 0 ? '+' : '-'}${man(Math.abs(best.net))}원), 가장 적은 달은 <b>${mLabel(worst.m)}</b>(${worst.net >= 0 ? '+' : '-'}${man(Math.abs(worst.net))}원)이에요.`);
  if (catStats[0]) add('var', catStats[0].c.slice(0, 1), `지출 1위는 <b>${josa(catStats[0].c, '으로', '로')}</b> 전체 지출의 <b>${pct(catStats[0].total, tot.exp)}%</b>(${man(catStats[0].total)}원)예요.${catStats[1] ? ` 그다음은 ${catStats[1].c} ${pct(catStats[1].total, tot.exp)}%, ${catStats[2] ? `${catStats[2].c} ${pct(catStats[2].total, tot.exp)}%` : ''}` : ''}`);
  if (tot.inc) add('fixed', '고', `고정지출(월세·월급·보험 등)이 수입의 <b>${pct(fixedTotal, tot.inc)}%</b>를 차지해요. ${pct(fixedTotal, tot.inc) >= 70 ? '고정비 부담이 큰 편이에요.' : pct(fixedTotal, tot.inc) >= 50 ? '수입의 절반 이상이 고정비로 나가요.' : '고정비 부담은 여유 있는 편이에요.'}`);
  if (base.length >= 3) {
    const si = slope(base.map(r => r.inc)), se = slope(base.map(r => r.exp));
    const trend = (sl, avg) => (Math.abs(sl) < avg * 0.02 ? '거의 그대로' : `한 달에 약 ${man(Math.abs(sl))}원씩 ${sl > 0 ? '느는' : '주는'} 흐름`);
    add(si >= se ? 'good' : 'bad', '↗', `추세로 보면 수입은 <b>${trend(si, avgInc)}</b>, 지출은 <b>${trend(se, avgExp)}</b>이에요.`);
  }
  if (base.length >= 4) {
    const r3 = base.slice(-3), p = base.slice(0, -3);
    const ci = mean(r3.map(r => r.inc)) - mean(p.map(r => r.inc)), ce = mean(r3.map(r => r.exp)) - mean(p.map(r => r.exp));
    add(ci - ce >= 0 ? 'good' : 'bad', '3', `최근 3개월은 그 전보다 한 달 평균 수입이 <b>${ci >= 0 ? '+' : '-'}${man(Math.abs(ci))}원</b>, 지출이 <b>${ce >= 0 ? '+' : '-'}${man(Math.abs(ce))}원</b> 달라졌어요.`);
  }
  // 평소보다 크게 튄 항목 (가장 최근 끝난 달 기준)
  if (base.length >= 3) {
    const last = base[base.length - 1], prev = base.slice(0, -1);
    const spikes = expCats.map(c => { const a = mean(prev.map(r => r.byCat[c] || 0)); const x = last.byCat[c] || 0; return { c, a, x, d: x - a }; })
      .filter(o => o.x > o.a * 1.5 && o.d >= 100000).sort((a, b) => b.d - a.d).slice(0, 2);
    spikes.forEach(o => add('bad', '!', `${mLabel(last.m)} <b>${josa(o.c, '이', '가')}</b> ${man(o.x)}원으로 평소(월평균 ${man(o.a)}원)보다 <b>${man(o.d)}원</b> 많았어요.`));
  }
  if (avgExp && tu) {
    const need = Math.ceil(avgExp / tu), cnt = Math.round(mean(base.map(r => r.payCnt)));
    add(cnt >= need ? 'good' : 'bad', '건', `한 달 평균 지출 ${man(avgExp)}원을 메우려면 4회 ${man(tu)}원 기준 <b>한 달에 결제 약 ${need}건</b>이 필요해요. 평균 결제는 약 ${cnt}건이에요.`);
  }
  // 결제가 보강·이월·카드 정산(3일)으로 달을 넘나들어 한 달 수강료는 들쭉날쭉할 수 있다 → 2~3개월 묶어서 보기
  if (base.length >= 3) {
    const tus = base.map(r => r.tuition), cvT = mean(tus) ? stdev(tus) / mean(tus) : 0;
    const r3 = mean(base.slice(-3).map(r => r.tuition));
    add('inc', '수', `최근 3개월 평균 수강료는 <b>${man(r3)}원</b>이에요.${cvT >= 0.15 ? ' 달마다 차이가 큰 편인데, 보강·이월로 결제가 밀리거나 월말 카드 결제가 다음 달에 정산되면 이렇게 보여요. 2~3개월을 묶어서 보세요.' : ''}`);
  }
  const feeTot = rows.reduce((a, r) => a + r.cardFee, 0);
  if (feeTot) add('var', '%', `카드 결제로 낸 수수료는 ${rows.length}개월 동안 약 <b>${man(feeTot)}원</b>(월평균 ${man(mean(base.map(r => r.cardFee)))}원)으로 추정돼요.`);
  const card = catStats.find(x => x.c === '카드');
  if (card && pct(card.total, tot.exp) >= 15) add('var', '카', `카드값이 지출의 ${pct(card.total, tot.exp)}%예요. 카드 이용내역을 따로 보면 실제로 어디에 썼는지 더 정확히 알 수 있어요.`);

  // 월별 순이익 막대 (양수 파랑, 음수 빨강)
  // 위·아래에 금액 글자 자리를 남기고 0원 선 위치를 정한다
  const pos = Math.max(...rows.map(r => r.net), 0), neg = Math.max(...rows.map(r => -r.net), 0);
  const W = Math.max(280, (v.clientWidth || 380) - 40), H = 210, T = 18, B = 26 + (neg ? 16 : 0);
  const scale = (H - T - B) / ((pos + neg) || 1), mid = T + pos * scale;
  const cw = W / rows.length, bw = Math.min(28, cw * 0.55);
  const bars = rows.map((r, i) => {
    const h = Math.max(2, Math.abs(r.net) * scale), x = i * cw + (cw - bw) / 2, y = r.net >= 0 ? mid - h : mid;
    const lab = `${r.net >= 0 ? '+' : '-'}${man(Math.abs(r.net))}`;
    return `<g><title>${mLabel(r.m)} 순이익 ${won(r.net)}</title><rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${r.net >= 0 ? 'var(--in)' : 'var(--red)'}" opacity="${r.partial ? 0.45 : 1}"/>
      ${cw >= 34 ? `<text x="${x + bw / 2}" y="${r.net >= 0 ? y - 5 : y + h + 12}" text-anchor="middle" font-size="10.5" fill="var(--t2)" font-weight="600">${lab}</text>` : ''}
      <text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--t3)">${i === 0 || r.m.slice(0, 4) !== rows[i - 1].m.slice(0, 4) ? r.m.slice(2, 4) + '.' : ''}${+r.m.slice(5)}</text></g>`;
  }).join('');
  const netChart = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%;height:auto;display:block" role="img" aria-label="월별 순이익 막대그래프"><line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="var(--fill-2)"/>${bars}</svg>`;

  // 월별 총괄표: 세로는 수입·고정/변동/기타 지출(소계+상세)·순이익, 가로는 달 + 합계 + 월평균
  const cum = S.sumMode === 'cum';
  const fullIdx = rows.map((r, k) => k).filter(k => !rows[k].partial);
  // 누적 평균: 첫 달부터 그 달까지(진행 중인 달 제외)의 평균
  const cell = (vals, k) => {
    if (!cum) return vals[k];
    if (rows[k].partial) return null;
    const upto = fullIdx.filter(x => x <= k).map(x => vals[x]);
    return mean(upto);
  };
  const fmt = n => (n == null ? '<span class="card-sub">–</span>' : n === 0 ? '<span style="color:var(--t4)">0</span>' : `${n < 0 ? '-' : ''}${Math.round(Math.abs(n)).toLocaleString('ko-KR')}`);
  const avgOf = vals => mean(fullIdx.length ? fullIdx.map(k => vals[k]) : vals);
  const line = (label, vals, cls = '', opt = {}) => {
    const total = vals.reduce((a, b) => a + b, 0), avg = avgOf(vals);
    const plain = label.replace(/<[^>]+>/g, '');
    const tds = rows.map((r, k) => {
      const v = cell(vals, k);
      // 그 항목의 월평균보다 15% 넘게 많은 달만 주황으로 (많을수록 진하게)
      const over = opt.heat && v != null && avg > 0 ? (v - avg) / avg : 0;
      const shade = over > 0.15 ? `background:color-mix(in srgb, var(--out) ${Math.round(10 + Math.min(over, 1.5) * 26)}%, transparent)` : '';
      return `<td class="${v < 0 ? 'neg' : ''}" style="${shade}" title="${mLabel(r.m)} ${plain} ${v == null ? '' : won(v)}">${fmt(v)}</td>`;
    }).join('');
    return `<tr class="${cls}"><td>${label}</td>${tds}<td class="${total < 0 ? 'neg' : ''}"><b>${fmt(total)}</b></td><td class="${avg < 0 ? 'neg' : ''}">${fmt(avg)}</td></tr>`;
  };
  const col = f => rows.map(f);
  const groupRows = EXP_GROUPS.map(g => {
    const detail = g.cats.map(c => ({ c, vals: col(r => r.byCat[c] || 0) })).filter(x => x.vals.some(Boolean));
    if (!detail.length) return '';
    return line(g.name, col(r => r.groups.find(x => x.name === g.name).total), 'grp') + detail.map(x => line(`<span class="ind">${x.c}</span>`, x.vals, 'det', { heat: true })).join('');
  }).join('');
  const rateRow = `<tr class="rate"><td>이익률</td>${rows.map((r, k) => { const a = cell(col(x => x.net), k), b = cell(col(x => x.inc), k); return `<td>${a == null || !b ? '–' : Math.round((a / b) * 100) + '%'}</td>`; }).join('')}<td>${tot.inc ? pct(tot.net, tot.inc) + '%' : '–'}</td><td>${avgInc ? pct(avgNet, avgInc) + '%' : '–'}</td></tr>`;
  const sumTable = `<div class="tbl-wrap"><table class="tbl sumtbl num"><thead><tr><th>항목</th>${rows.map(r => `<th>${mShort(r.m)}${r.partial ? '<br><span style="font-weight:500">진행 중</span>' : ''}</th>`).join('')}<th>합계</th><th>월평균</th></tr></thead><tbody>
    ${line('수입', col(r => r.inc), 'top in')}
    ${line('<span class="ind">수강료</span>', col(r => r.tuition), 'det')}
    ${col(r => r.inc - r.tuition).some(Boolean) ? line('<span class="ind">기타수입</span>', col(r => r.inc - r.tuition), 'det') : ''}
    ${line('지출', col(r => r.exp), 'top')}
    ${groupRows}
    ${line('순이익', col(r => r.net), 'top net')}
    ${rateRow}
    ${col(r => r.moveOut).some(Boolean) ? line('<span class="ind">(참고) 통장이동 나간 돈</span>', col(r => r.moveOut), 'ref') : ''}
  </tbody></table></div>`;

  // 항목별 통계
  const catRows = catStats.map(x => `<div class="row">
      <span class="ic ${x.group.key}">${x.c.slice(0, 1)}</span>
      <span class="mid"><span class="t" style="display:block">${x.c}${x.avg && base.length >= 3 ? (x.cv >= 0.6 ? '<span class="cv hi">들쭉날쭉</span>' : x.cv <= 0.15 ? '<span class="cv lo">일정</span>' : '') : ''}</span>
        <span class="s" style="display:block">월평균 ${man(x.avg)}원 · 가장 많은 달 ${mShort(x.peak.m)} ${man(x.peak.byCat[x.c] || 0)}원</span>
        <span class="meter"><span style="width:${Math.max(2, pct(x.total, tot.exp))}%"></span></span></span>
      <span class="r"><span class="a num" style="display:block">${man(x.total)}원</span><span class="rs num" style="display:block">${pct(x.total, tot.exp)}%</span></span>
    </div>`).join('');

  // 통계 숫자
  const sdInc = stdev(base.map(r => r.inc)), sdExp = stdev(base.map(r => r.exp));
  const statBox = (label, val, sub) => `<div><div class="label">${label}</div><div class="v num">${val}</div><div class="d">${sub}</div></div>`;
  const stats4 = `<div class="stat-grid">
    ${statBox('월평균 수입', man(avgInc) + '원', `보통 ±${man(sdInc)}원 오르내림`)}
    ${statBox('월평균 지출', man(avgExp) + '원', `보통 ±${man(sdExp)}원 오르내림`)}
    ${statBox('흑자 달', `${plus} / ${rows.length}개월`, `흑자율 ${pct(plus, rows.length)}%`)}
    ${statBox('평균 이익률', avgInc ? pct(avgNet, avgInc) + '%' : '–', '순이익 ÷ 수입')}
    ${statBox('고정비 비율', tot.inc ? pct(fixedTotal, tot.inc) + '%' : '–', '고정지출 ÷ 수입')}
    ${statBox('월평균 수강료', man(mean(base.map(r => r.tuition))) + '원', `결제 약 ${Math.round(mean(base.map(r => r.payCnt)))}건`)}
    ${statBox('최근 3개월 평균 수강료', man(mean(base.slice(-3).map(r => r.tuition))) + '원', '결제가 달을 넘어가도 흐름이 보여요')}
    ${statBox('카드 수수료 (추정)', man(mean(base.map(r => r.cardFee))) + '원', `월평균 · 수수료율 ${(cardFeeRate() * 100).toFixed(1)}%`)}
  </div>`;

  v.innerHTML = `
  <div class="hello"><h2>한눈에 보는 통계</h2><p>${mLabel(ms[0])} ~ ${mLabel(ms.at(-1))} · ${rows.length}개월</p></div>
  <section class="card span2">${seg}</section>
  <section class="card hero">
    <div class="label">${rows.length}개월 누적 순이익</div>
    <div class="big num ${tot.net < 0 ? 'neg' : ''}">${won(tot.net)}</div>
    <p class="caption">수입 ${won(tot.inc)} · 지출 ${won(tot.exp)}</p>
  </section>
  <section class="card">
    <div class="card-title" style="margin-bottom:14px">핵심 포인트</div>
    <ul class="ins-points">${pts.join('')}</ul>
  </section>
  <section class="card span2">
    <div class="card-head" style="flex-wrap:wrap"><div><div class="card-title">월별 총괄표</div><div class="card-sub">${cum ? '각 달 칸은 첫 달부터 그 달까지의 평균이에요' : '고정·변동·기타 지출을 달마다 나란히 봐요'} · 단위 원 · 월평균은 진행 중인 달 제외</div></div>
      <div class="seg" style="grid-template-columns:1fr 1fr;min-width:200px">${[['month', '월별 금액'], ['cum', '누적 평균']].map(([k, l]) => `<button data-summode="${k}" aria-pressed="${(S.sumMode || 'month') === k}">${l}</button>`).join('')}</div></div>
    ${sumTable}
    <p class="card-sub" style="font-size:12px;margin-top:10px">주황색 칸은 그 항목의 월평균보다 많이 쓴 달이에요(많을수록 진하게). 통장이동은 수입·지출에서 빼고 참고로만 보여드려요.</p>
  </section>
  <section class="card span2">
    <div class="card-head"><div><div class="card-title">월별 순이익</div><div class="card-sub">파랑은 흑자, 빨강은 적자${rows.some(r => r.partial) ? ' · 흐린 막대는 진행 중인 달' : ''}</div></div></div>
    ${netChart}
  </section>
  <section class="card">
    <div class="card-title">통계</div>
    <div class="card-sub" style="margin-bottom:14px">${full.length < rows.length ? '진행 중인 이번 달은 평균에서 뺐어요' : '선택한 기간 기준이에요'}</div>
    ${stats4}
  </section>
  <section class="card">
    <div class="card-title">항목별 분석</div>
    <div class="card-sub" style="margin-bottom:6px">기간 합계 순 · '들쭉날쭉'은 달마다 차이가 큰 항목이에요</div>
    <div class="rows">${catRows || '<div class="empty">지출 기록이 없어요</div>'}</div>
  </section>
  <section class="card ai-card">
    <div class="card-title">${aiName(aiMode())} 전체 기간 리포트</div>
    <div class="card-sub" style="margin-bottom:14px">선택한 기간 전체를 보고 흐름과 할 일을 짚어 드려요</div>
    <div id="aiAllOut" class="ai ${S.aiAll ? '' : 'muted'}">${S.aiAll ? esc(S.aiAll) : '버튼을 누르면 위 숫자들을 바탕으로 종합 분석을 써 드려요.'}</div>
    ${aiMode() ? `<button class="btn sub press" id="aiAllBtn">${S.aiAll ? '다시 분석하기' : '전체 리포트 받기'}</button>` : `<button class="btn sub press" data-go="settings">설정에서 AI 연결하기</button>`}
  </section>`;
}

async function aiReportAll() {
  if (!aiMode()) return;
  const ms = rangeMonths();
  const rows = ms.map(m => ({ m, ...stats(m) }));
  const expCats = EXP_GROUPS.flatMap(g => g.cats);
  const monthLines = rows.map(r => `${r.m}${r.m === thisMonth ? '(진행 중)' : ''}: 수입 ${r.inc}, 지출 ${r.exp}, 순이익 ${r.net}, 수강료 ${r.tuition}, 항목 ${expCats.filter(c => r.byCat[c]).map(c => `${c} ${r.byCat[c]}`).join(' / ')}`).join('\n');
  const prompt = `당신은 작은 미술학원 원장님의 장부를 봐주는 회계 도우미입니다. 아래 월별 숫자만 근거로 ${ms[0]}~${ms.at(-1)} 전체 기간을 한국어로 분석해 주세요.
형식: 7줄 이내, 각 줄은 "• "로 시작, 금액은 만원 단위, 친근한 해요체, 마크다운 굵게/표 없이 평문.
참고: 이 학원은 4회분을 3회차에 미리 결제하고 보강·이월로 결제가 다음 달로 밀릴 수 있으며, 카드 결제는 3일 뒤 정산돼요. 수강료는 2~3개월 묶어서 판단해 주세요.
내용: ① 전체 기간 한 줄 결론 ② 수입 흐름(계절·추세) ③ 지출 구조에서 가장 큰 부담 ④ 달마다 들쭉날쭉한 항목과 이유 추정 ⑤ 적자 달의 공통점 ⑥ 수강료 단가 ${S.config.tuition}원 기준 손익분기 원생 수 ⑦ 앞으로 해볼 만한 한 가지.
진행 중인 달은 덜 끝난 달이니 평가에서 조심해서 다뤄 주세요.

월별(원):
${monthLines}`;
  const out = $('#aiAllOut'), btn = $('#aiAllBtn');
  btn.disabled = true; out.classList.remove('muted'); out.textContent = '분석하고 있어요…';
  try {
    S.aiAll = await aiText(prompt, text => { out.textContent = text; });
    out.textContent = S.aiAll;
  } catch (e) {
    out.textContent = e instanceof AIError ? e.message : e?.text || '리포트를 만들지 못했어요. 다시 눌러주세요.';
  }
  btn.disabled = false; btn.textContent = '다시 분석하기';
}

function drawChart() {
  const box = $('#chart');
  if (!box) return;
  const ms = monthList().filter(m => m <= S.month).slice(-6);
  const data = ms.map(m => ({ m, ...stats(m) }));
  const W = Math.max(280, box.clientWidth || 500), H = 200, L = 38, R = 4, T = 10, B = 28;
  const max = Math.max(1, ...data.map(d => Math.max(d.inc, d.exp)));
  const step = [1e5, 2e5, 5e5, 1e6, 2e6, 5e6, 1e7, 2e7, 5e7].find(s => max / s <= 4) || 1e8;
  const top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top);
  const cw = (W - L - R) / data.length, bw = Math.min(18, (cw - 16) / 2);
  let g = '';
  for (let v = 0; v <= top + 1; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--fill)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--t4)">${v ? man(v) : '0'}</text>`;
  const bar = (x, v, color, op) => {
    if (!v) return '';
    const h = Math.max(2, y(0) - y(v)), r = Math.min(4, bw / 2, h), y0 = y(0), y1 = y0 - h;
    return `<path d="M${x},${y0}V${y1 + r}Q${x},${y1} ${x + r},${y1}H${x + bw - r}Q${x + bw},${y1} ${x + bw},${y1 + r}V${y0}Z" fill="${color}" opacity="${op}"/>`;
  };
  data.forEach((d, i) => {
    const cx = L + cw * i + cw / 2, sel = d.m === S.month, op = sel ? 1 : .45;
    g += bar(cx - bw - 1, d.inc, 'var(--in)', op) + bar(cx + 1, d.exp, 'var(--out)', op);
    const [yy, mm] = d.m.split('-');
    const showYear = i === 0 || mm === '01';
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="12" fill="${sel ? 'var(--t1)' : 'var(--t3)'}" font-weight="${sel ? 700 : 500}">${showYear ? yy.slice(2) + '.' : ''}${+mm}월</text>`;
    g += `<rect class="hit" data-i="${i}" x="${L + cw * i}" y="${T}" width="${cw}" height="${H - T}" fill="transparent" style="cursor:pointer"/>`;
  });
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="월별 수입과 지출 막대그래프">${g}</svg><div class="tip" hidden></div>`;
  const tip = box.querySelector('.tip');
  box.querySelectorAll('.hit').forEach(el => {
    const d = data[+el.dataset.i];
    el.addEventListener('mouseenter', () => {
      tip.innerHTML = `<b>${mLabel(d.m)}</b><br>수입 ${won(d.inc)}<br>지출 ${won(d.exp)}<br>순이익 ${won(d.net)}`;
      tip.hidden = false;
      tip.style.left = Math.min(Math.max(+el.getAttribute('x') + cw / 2, 80), W - 80) + 'px';
      tip.style.top = y(Math.max(d.inc, d.exp)) - 8 + 'px';
    });
    el.addEventListener('mouseleave', () => (tip.hidden = true));
    el.addEventListener('click', () => { S.month = d.m; render(); });
  });
}

화면에 보이는 거래를 하나도 빠짐없이 추출하세요. 여러 장이면 모든 장의 거래를 합치세요(겹치는 거래도 그대로 두세요, 중복 제거는 프로그램이 합니다).

async function readShots() {
  if (!aiMode() || !S.pending.length) return;
  const who = aiName(aiMode());
  S.busy = true; S.statusMsg = `${who}가 캡처를 읽고 있어요. 보통 20~60초 걸려요`; S.statusKind = ''; render();
  const per = Math.max(1, aiMode() === 'app' ? imgLimits?.maxCount || 5 : 5);
  const files = S.pending.map(p => p.file);
  const all = [];
  try {
    for (let i = 0; i < files.length; i += per) {
      const chunk = files.slice(i, i + per);
      if (files.length > per) { S.statusMsg = `${who}가 캡처를 읽고 있어요 (${Math.min(i + per, files.length)}/${files.length}장)`; render(); }
      all.push(...await aiExtract(chunk, buildPrompt()));
    }
  } catch (e) {
    S.busy = false;
    S.statusMsg = e instanceof AIError ? e.message : {
      not_granted: 'Claude 사용을 허용해야 사진을 읽을 수 있어요.',
      rate_limited: '요청이 많아요. 1~2분 뒤에 다시 눌러주세요.',
      image_rejected: '읽을 수 없는 사진이 있어요. PNG나 JPG 캡처로 다시 올려주세요.',
      invalid_json: 'Claude 답을 해석하지 못했어요. 한 번 더 눌러주세요.',
      images_unavailable: '이 화면에서는 사진 읽기를 쓸 수 없어요.',
      cancelled: '취소했어요.',
    }[e?.code] || '사진을 읽지 못했어요. 잠시 후 다시 해주세요.';
    S.statusKind = 'err';
    if (all.length) { buildReview(all); S.reviewSrc = 'shot'; }
    render();
    return;
  }
  S.busy = false;
  buildReview(all); S.reviewSrc = 'shot';
  S.pending.forEach(p => URL.revokeObjectURL(p.url));
  S.pending = [];
  if (!S.review.length) { S.review = null; S.statusMsg = '거래를 찾지 못했어요. 거래내역 화면이 맞는지 확인해주세요.'; S.statusKind = 'err'; }
  else { S.statusMsg = ''; S.statusKind = ''; }
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function txKey(t) { return `${t.dt}|${t.dir}|${t.amount}|${normName(t.name)}`; }
function buildReview(raw) {
  const seen = new Set(), existing = new Set();
  Object.values(S.months).forEach(items => items.forEach(t => existing.add(txKey(t))));
  const out = [];
  for (const r of raw) {
    const amount = Math.round(Number(String(r.amount ?? '').replace(/[^\d.]/g, '')));
    const date = String(r.date || '').match(/(\d{4})\D?(\d{1,2})\D?(\d{1,2})/);
    if (!amount || !date) continue;
    const dir = /출/.test(r.type) ? 'out' : 'in';
    const time = String(r.time || '').match(/\d{1,2}:\d{2}(:\d{2})?/)?.[0] || '';
    const dt = `${date[1]}-${date[2].padStart(2, '0')}-${date[3].padStart(2, '0')}` + (time ? ' ' + (time.length === 5 ? time + ':00' : time.padStart(8, '0')) : '');
    const name = String(r.name || '').trim() || '(이름없음)';
    const bal = r.balance == null || r.balance === '' ? null : Math.round(Number(String(r.balance).replace(/[^\d.-]/g, '')));
    const t = { dt, dir, amount, name, memo: String(r.memo || '').trim(), bal: Number.isFinite(bal) ? bal : null };
    const k = txKey(t);
    if (seen.has(k)) continue;
    seen.add(k);
    const local = classify(dir, name, t.memo);
    const cats = dir === 'in' ? IN_CATS : OUT_CATS;
    let cat, how;
    if (local) ({ cat, how } = local);
    else if (cats.includes(r.category)) { cat = r.category; how = dir === 'in' && cat === '수강료' ? 'default' : 'claude'; }
    else { cat = dir === 'in' ? '수강료' : '기타'; how = 'none'; }
    const dup = existing.has(k);
    out.push({ ...t, cat, how, dup, keep: !dup, orig: cat });
  }
  out.sort((a, b) => (a.dup - b.dup) || b.dt.localeCompare(a.dt));
  S.review = out;
}

async function saveReview() {
  const rows = S.review.filter(r => !r.dup && r.keep);
  const touched = new Set();
  let learned = 0;
  for (const r of rows) {
    const m = r.dt.slice(0, 7);
    const t = { id: hash(txKey(r) + '|' + Date.now() + Math.random()), dt: r.dt, dir: r.dir, amount: r.amount, name: r.name, memo: r.memo, bal: r.bal, cat: r.cat, src: S.reviewSrc || 'shot' };
    (S.months[m] = S.months[m] || []).push(t);
    touched.add(m);
    // 사람이 고른 항목(또는 추정을 그대로 확정한 항목)은 규칙으로 기억
    const key = normName(r.name);
    if ((r.cat !== r.orig || r.how === 'claude' || r.how === 'user') && !(r.dir === 'in' && r.cat === '수강료')) {
      if (S.config.rules[r.dir][key] !== r.cat) { S.config.rules[r.dir][key] = r.cat; learned++; }
    }
  }
  S.review = null;
  const months = [...touched].sort();
  for (const m of months) await saveMonth(m);
  if (learned) await saveConfig();
  if (months.length) S.month = months.at(-1);
  toast(`${rows.length}건을 장부에 넣었어요${learned ? ` · 거래처 ${learned}곳을 기억했어요` : ''}`);
  S.tab = 'dash';
  render();
  window.scrollTo({ top: 0 });
}

  $('#listCat').innerHTML = S.catFilter ? `<div style="margin-top:10px"><button class="tag blue press" data-clearcat>${esc(S.catFilter)}만 보는 중 ×</button></div>` : '';

async function changeCat(id, cat) {
  for (const m of Object.keys(S.months)) {
    const t = S.months[m].find(x => x.id === id);
    if (!t) continue;
    if (t.cat === cat) return;
    t.cat = cat;
    await saveMonth(m);
    const key = normName(t.name);
    if (!(t.dir === 'in' && cat === '수강료') && S.config.rules[t.dir][key] !== cat) {
      S.config.rules[t.dir][key] = cat;
      await saveConfig();
      toast(`'${t.name}'은 앞으로 ${cat}로 분류할게요`);
    } else toast('항목을 바꿨어요');
    render();
    return;
  }
}

async function saveEdit() {
  const id = S.sheetTx;
  const oldM = Object.keys(S.months).find(m => S.months[m].some(x => x.id === id));
  if (!oldM) { closeSheet(); return; }
  const t = S.months[oldM].find(x => x.id === id);
  const date = $('#eDate').value, amount = parseInt($('#eAmt').value, 10), name = $('#eName').value.trim();
  if (!date || !(amount > 0) || !name) { toast('날짜, 금액, 거래처를 채워주세요'); return; }
  let time = $('#eTime').value;
  if (time && time.length === 5) time += ':00';
  const dir = $('#eDir').value === 'in' ? 'in' : 'out';
  const cats = dir === 'in' ? IN_CATS : OUT_CATS;
  const cat = cats.includes($('#eCat').value) ? $('#eCat').value : cats === IN_CATS ? '수강료' : '기타';
  const catChanged = cat !== t.cat || dir !== t.dir;
  Object.assign(t, { dt: date + (time ? ' ' + time : ''), dir, amount, name, memo: $('#eMemo').value.trim(), cat });
  const newM = date.slice(0, 7);
  if (newM !== oldM) {
    S.months[oldM] = S.months[oldM].filter(x => x.id !== id);
    (S.months[newM] = S.months[newM] || []).push(t);
    await saveMonth(oldM);
  }
  await saveMonth(newM);
  // 항목을 바꿨으면 같은 거래처의 다음 거래에도 적용되게 기억
  const key = normName(name);
  if (catChanged && !(dir === 'in' && cat === '수강료') && S.config.rules[dir][key] !== cat) { S.config.rules[dir][key] = cat; await saveConfig(); }
  closeSheet();
  S.month = newM;
  toast('수정했어요');
  render();
}

// '쿠팡 = 재료비', '현대해, 삼성화 = 보험' 같은 줄을 읽는다
function parseKwText(text) {
  const all = new Set([...OUT_CATS, ...IN_CATS]);
  const rules = [], bad = [];
  for (const line of text.split(/\n/).map(l => l.trim()).filter(Boolean)) {
    const m = line.match(/^(.+?)\s*(?:=|→|->|:)\s*(.+)$/);
    const cat = m && m[2].trim().replace(/^기타\s*\((.+)\)$/, '$1');
    if (!m || !all.has(cat)) { bad.push(line); continue; }
    m[1].split(/[,/|·]/).map(k => k.trim()).filter(Boolean).forEach(kw => rules.push({ kw, cat }));
  }
  return { rules, bad };
}
function kwChanges() {
  const out = [];
  for (const m of Object.keys(S.months)) for (const t of S.months[m]) { const c = kwMatch(t.dir, t.name); if (c && c !== t.cat) out.push([m, t, c]); }
  return out;
}
const kwPreview = () => kwChanges().length;
async function addKwRules() {
  const { rules, bad } = parseKwText($('#kwText').value);
  if (!rules.length) { toast(bad.length ? `'${bad[0]}' 줄을 이해하지 못했어요. '글자 = 항목' 모양으로 써주세요` : '규칙을 입력해주세요'); return; }
  const list = (S.config.kwRules || []).filter(r => !rules.some(n => normName(n.kw).toUpperCase() === normName(r.kw).toUpperCase()));
  S.config.kwRules = [...rules, ...list];
  await saveConfig();
  // 규칙을 넣으면 이미 장부에 있는 거래에도 바로 적용한다
  const changes = kwChanges();
  const touched = new Set();
  for (const [m, t, c] of changes) { t.cat = c; touched.add(m); }
  for (const m of touched) await saveMonth(m);
  render();
  toast(`규칙 ${rules.length}개를 넣고 지난 거래 ${changes.length}건을 바꿨어요${bad.length ? ` · ${bad.length}줄은 건너뛰었어요` : ''}`);
}
async function applyKwRules() {
  const changes = kwChanges();
  const touched = new Set();
  for (const [m, t, c] of changes) { t.cat = c; touched.add(m); }
  for (const m of touched) await saveMonth(m);
  render();
  toast(`거래 ${changes.length}건의 항목을 바꿨어요`);
}

  } catch (e) {

  }

}

// 파일 저장: Claude 앱 안에서는 downloads 기능, 독립 사이트에서는 브라우저 다운로드
async function saveFile(filename, data, mime) {
  if (downloads) {
    try { await downloads.save({ filename, data }); return true; }
    catch (e) { if (e?.code === 'declined') return false; }
  }
  const url = URL.createObjectURL(new Blob([data], { type: mime }));
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return true;
}

// 가져온 거래를 기존 장부에 합친다 (같은 날·금액·거래처가 이미 있으면 그만큼 건너뜀)
function mergeTx(list) {
  const have = new Map();
  Object.values(S.months).forEach(items => items.forEach(t => { const k = txKey(t); have.set(k, (have.get(k) || 0) + 1); }));
  const seen = new Map(), touched = new Set();
  let added = 0;
  for (const raw of list) {
    if (!raw || typeof raw.dt !== 'string' || !/^\d{4}-\d{2}-\d{2}/.test(raw.dt) || !(raw.amount > 0)) continue;
    const dir = raw.dir === 'in' ? 'in' : 'out';
    const cats = dir === 'in' ? IN_CATS : OUT_CATS;
    const t = { id: String(raw.id || ''), dt: raw.dt, dir, amount: Math.round(raw.amount), name: String(raw.name || '(이름없음)'), memo: String(raw.memo || ''), bal: Number.isFinite(raw.bal) ? raw.bal : null, cat: cats.includes(raw.cat) ? raw.cat : cats === IN_CATS ? '수강료' : '기타', src: raw.src || 'import' };
    const k = txKey(t), n = (seen.get(k) || 0) + 1;
    seen.set(k, n);
    if (n <= (have.get(k) || 0)) continue;
    if (!t.id) t.id = hash(k + '|' + n + '|' + Math.random());
    const m = t.dt.slice(0, 7);
    (S.months[m] = S.months[m] || []).push(t);
    touched.add(m); added++;
  }
  return { added, months: [...touched].sort() };
}

/* ───────── 엑셀 읽기 공통 ───────── */
const xlP2 = n => String(n).padStart(2, '0');
const xlTime = v => {
  if (typeof v === 'number' && v >= 0 && v < 1) { const s = Math.round(v * 86400); return `${xlP2(Math.floor(s / 3600))}:${xlP2(Math.floor(s / 60) % 60)}:${xlP2(s % 60)}`; }
  const m = String(v ?? '').trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  return m ? `${xlP2(m[1])}:${m[2]}:${m[3] || '00'}` : '';
};
// 엑셀 날짜 숫자, '2025/04/02 14:05:32', '2025.04.02', '20250402', '2025년 4월 2일' 등을 'YYYY-MM-DD[ HH:MM:SS]'로
const xlDate = v => {
  if (typeof v === 'number' && v > 20000 && v < 80000) {
    const d = XLSX.SSF.parse_date_code(v);
    const date = `${d.y}-${xlP2(d.m)}-${xlP2(d.d)}`;
    return d.H || d.M || d.S ? `${date} ${xlP2(d.H)}:${xlP2(d.M)}:${xlP2(Math.floor(d.S))}` : date;
  }
  const m = String(v ?? '').trim().match(/^(\d{4})[-/.년\s]*(\d{1,2})[-/.월\s]*(\d{1,2})일?\s*(\d{1,2}:\d{2}(?::\d{2})?)?/);
  if (!m || +m[2] < 1 || +m[2] > 12 || +m[3] < 1 || +m[3] > 31) return null;
  const date = `${m[1]}-${xlP2(m[2])}-${xlP2(m[3])}`;
  return m[4] ? `${date} ${xlTime(m[4])}` : date;
};
const xlNum = v => { const n = typeof v === 'number' ? v : Number(String(v ?? '').replace(/[^\d.-]/g, '')); return Number.isFinite(n) && n > 0 ? Math.round(n) : 0; };
const xlStr = v => (v == null ? '' : String(v).trim());
// 시트가 B열부터 시작해도 열 번호가 A열 기준이 되도록 A1부터 읽는다
const xlRows = ws => {
  if (!ws || !ws['!ref']) return [];
  const r = XLSX.utils.decode_range(ws['!ref']); r.s.c = 0; r.s.r = 0;
  return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, range: r });
};

/* ───────── 은행에서 받은 거래내역 엑셀(농협 등) ───────── */
// 제목 줄에서 칸 위치를 찾는다: 거래일자·출금·입금·잔액·거래기록사항 …
function bankHeader(row) {
  const h = (row || []).map(v => xlStr(v).replace(/\s/g, ''));
  const find = (re, not) => h.findIndex(x => x && re.test(x) && !(not && not.test(x)));
  const date = find(/거래일시|거래일자|거래일|^일자|^날짜|^일시/);
  const time = find(/^거래시간$|^시간$|거래시각/);
  const out = find(/출금|찾으신|지급/, /잔액|후|자명|계좌/);
  const inn = find(/입금|맡기신/, /잔액|후|자명|자$|계좌/);
  const amt = find(/^거래금액|^금액/);
  const kind = find(/^구분$|입출금구분|거래구분|입출구분/);
  const bal = find(/잔액/);
  const name = [/거래기록사항/, /기록사항/, /^적요/, /받는분|보내는분|입금자명|의뢰인|수취인|상대/, /^내용$|거래처/].map(re => find(re)).find(i => i >= 0) ?? -1;
  const memo = [/거래내용/, /이체메모|^메모/, /거래점|취급점/].map(re => find(re)).filter(i => i >= 0 && i !== name);
  const hasInOut = out >= 0 && inn >= 0 && out !== inn;
  if (date < 0 || (!hasInOut && (amt < 0 || kind < 0))) return null;
  return { date, time, out: hasInOut ? out : -1, inn: hasInOut ? inn : -1, amt, kind, bal, name, memo };
}
// 결과는 사진 읽기와 같은 모양({date,time,type,name,amount,balance,memo,category})이라 같은 확인 화면을 쓴다
function parseBankWorkbook(wb) {
  const raw = [];
  for (const sn of wb.SheetNames) {
    const rows = xlRows(wb.Sheets[sn]);
    let hi = -1, c = null;
    for (let i = 0; i < Math.min(rows.length, 40); i++) { c = bankHeader(rows[i]); if (c) { hi = i; break; } }
    if (hi < 0) continue;
    for (const r of rows.slice(hi + 1)) {
      let dt = xlDate(r[c.date]);
      if (!dt) continue;
      if (dt.length === 10 && c.time >= 0) { const t = xlTime(r[c.time]); if (t) dt += ' ' + t; }
      const [date, time = ''] = dt.split(' ');
      const name = (c.name >= 0 && xlStr(r[c.name])) || (c.memo.length && xlStr(r[c.memo[0]])) || '(이름없음)';
      const memo = c.memo.map(i => xlStr(r[i])).filter(x => x && x !== name).join(' · ');
      const bal = c.bal >= 0 && r[c.bal] != null && xlStr(r[c.bal]) !== '' ? Math.round(Number(String(r[c.bal]).replace(/[^\d.-]/g, ''))) : null;
      const push = (type, amount) => { if (amount) raw.push({ date, time, type, name, amount, balance: Number.isFinite(bal) ? bal : null, memo, category: type === '입금' ? '수강료' : '' }); };
      if (c.out >= 0) { push('출금', xlNum(r[c.out])); push('입금', xlNum(r[c.inn])); }
      else push(/출|지급|찾/.test(xlStr(r[c.kind])) ? '출금' : '입금', xlNum(r[c.amt]));
    }
    if (raw.length) break;
  }
  return raw;
}

// 처음 보는 출금 거래처 이름만 AI에게 항목을 물어본다 (글자만 보내서 비용이 아주 적음)
async function aiClassifyNames(names) {
  const rules = Object.entries(S.config.rules?.out || {}).slice(0, 200).map(([k, c]) => `${k}=${c}`).join(', ');
  const prompt = `미술학원 사업자 통장의 출금 거래처 이름 목록입니다. 각 이름을 [${OUT_CATS.join(', ')}] 중 하나로 분류하세요.
카드사 이름이나 "OO카드"는 카드(카드대금), 원장 본인 다른 계좌로 보낸 돈은 통장이동, 모르겠으면 기타.
식당·음식점·빵집·편의점·매점처럼 이름만 봐도 먹는 곳이면 식대, 커피·카페는 카페, 주유소·충전소는 주유비.
이 학원의 기존 분류 예: ${rules || '(없음)'}
거래처 이름 목록:
${names.map(n => '- ' + n).join('\n')}

반드시 이 JSON 하나만 답하세요: {"items":[{"name":"쿠팡","category":"재료비"}]}`;
  const schema = { type: 'object', properties: { items: { type: 'array', items: { type: 'object', properties: { name: { type: 'string' }, category: { type: 'string', enum: OUT_CATS } }, required: ['name', 'category'], additionalProperties: false } } }, required: ['items'], additionalProperties: false };
  const mode = aiMode();
  let res;
  if (mode === 'app') res = await sample.json(prompt, { modelTier: 'quick' });
  else if (mode === 'gemini') res = parseJSONLoose(await geminiGenerate([{ text: prompt }], true));
  else if (mode === 'anthropic') {
    try {
      const client = await anthropicClient();
      const model = AI.models.anthropic || DEFAULT_MODEL.anthropic;
      const params = anthropicParams(model, prompt, { output_config: { effort: 'low', format: { type: 'json_schema', schema } } });
      const msg = wantsFallback(model)
        ? await client.beta.messages.create({ ...params, betas: ['server-side-fallback-2026-07-01'], fallbacks: 'default' })
        : await client.messages.create(params);
      if (msg.stop_reason !== 'end_turn') return {};
      res = parseJSONLoose(msg.content.filter(b => b.type === 'text').map(b => b.text).join(''));
    } catch (e) { throw mapAnthropicError(e); }
  } else return {};
  const map = {};
  (res?.items || []).forEach(x => { if (x && OUT_CATS.includes(x.category)) map[String(x.name)] = x.category; });
  return map;
}

async function readBankFile(file) {
  if (!window.XLSX) { toast('엑셀 기능을 불러오지 못했어요. 새로고침해주세요'); return; }
  S.review = null; S.busy = true; S.statusMsg = '엑셀 파일을 읽고 있어요'; S.statusKind = ''; render();
  let raw;
  try {
    const buf = await file.arrayBuffer();
    let wb;
    if (/\.csv$/i.test(file.name) || /csv/.test(file.type)) {
      // 국내 은행 CSV는 EUC-KR인 경우가 많다: UTF-8로 안 풀리면 EUC-KR로 읽는다
      let text;
      try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (e) { text = new TextDecoder('euc-kr').decode(buf); }
      wb = XLSX.read(text.replace(/^﻿/, ''), { type: 'string', raw: true });
    } else wb = XLSX.read(buf, { type: 'array' });
    raw = parseBankWorkbook(wb);
  }
  catch (e) {
    S.busy = false; S.statusKind = 'err';
    S.statusMsg = /password|encrypt|ECMA-376|CFB/i.test(String(e?.message || e))
      ? '암호가 걸린 파일이에요. 엑셀에서 파일을 열어 암호 없이 다른 이름으로 저장한 뒤 올려주세요.'
      : '파일을 읽지 못했어요. 은행에서 받은 엑셀(xls, xlsx)이나 CSV 파일인지 확인해주세요.';
    render(); return;
  }
  if (!raw.length) {
    S.busy = false; S.statusKind = 'err';
    S.statusMsg = '거래내역을 찾지 못했어요. 거래일자·입금·출금 칸이 있는 거래내역 파일인지 확인해주세요.';
    render(); return;
  }
  const unknown = [...new Set(raw.filter(r => r.type === '출금' && !classify('out', r.name, r.memo)).map(r => r.name))].slice(0, 200);
  if (unknown.length && aiMode()) {
    S.statusMsg = `거래 ${raw.length}건을 찾았어요. 처음 보는 거래처 ${unknown.length}곳을 ${aiName(aiMode())}가 분류하고 있어요`; render();
    try { const map = await aiClassifyNames(unknown); raw.forEach(r => { if (r.type === '출금' && map[r.name]) r.category = map[r.name]; }); }
    catch (e) { toast('거래처 자동 분류는 건너뛰었어요. 항목을 직접 확인해주세요'); }
  }
  S.busy = false; S.statusMsg = ''; S.statusKind = '';
  buildReview(raw);
  S.reviewSrc = 'bank';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 수기 엑셀 장부 형식(총괄, 'N월 출금', 'N월 입금', 'N월입출금' 시트)을 읽는다
function parseLedgerWorkbook(wb) {
  const p2 = xlP2, nd = xlDate, num = xlNum, str = xlStr, sheetRows = xlRows;
  const list = [];
  const add = (dt, dir, amount, name, cat, memo, bal) => {
    if (!dt || !amount) return;
    list.push({ dt, dir, amount, name: str(name) || '(이름없음)', memo: str(memo), bal: typeof bal === 'number' ? Math.round(bal) : null, cat, src: 'excel' });
  };
  for (const sn of wb.SheetNames) {
    const rows = sheetRows(wb.Sheets[sn]);
    if (sn.includes('입출금')) {
      for (const r of rows) {
        const dt = nd(r[1]); if (!dt) continue;
        const cat = str(r[8]);
        if (num(r[3])) add(dt, 'out', num(r[3]), r[7], OUT_CATS.includes(cat) ? cat : '기타', r[6], r[5]);
        if (num(r[4])) add(dt, 'in', num(r[4]), r[7], cat === '통장이동' ? '통장이동' : '수강료', r[6], r[5]);
      }
    } else if (sn.includes('출금')) {
      for (const r of rows) { const dt = nd(r[0]); const cat = str(r[4]); if (dt) add(dt, 'out', num(r[3]), r[2], OUT_CATS.includes(cat) ? cat : '기타'); }
    } else if (sn.includes('입금')) {
      for (const r of rows) { const dt = nd(r[0]); if (dt) add(dt, 'in', num(r[2]), r[1], '수강료'); }
    }
  }
  // 거래처별로 가장 많이 쓴 항목을 분류 규칙으로
  const cnt = {};
  list.filter(t => t.dir === 'out').forEach(t => { const k = normName(t.name); (cnt[k] = cnt[k] || {})[t.cat] = (cnt[k][t.cat] || 0) + 1; });
  const rules = { in: {}, out: {} };
  for (const [k, c] of Object.entries(cnt)) rules.out[k] = Object.entries(c).sort((a, b) => b[1] - a[1])[0][0];
  // 총괄 시트의 재원생수
  const students = {};
  const years = {}; list.forEach(t => { const y = t.dt.slice(0, 4); years[y] = (years[y] || 0) + 1; });
  const year = Object.entries(years).sort((a, b) => b[1] - a[1])[0]?.[0];
  const sum = wb.SheetNames.find(n => n.includes('총괄'));
  if (sum && year) {
    const rows = sheetRows(wb.Sheets[sum]);
    const head = rows.find(r => str(r[0]) === '항목'), stu = rows.find(r => str(r[0]).replace(/\s/g, '') === '재원생수');
    if (head && stu) head.forEach((h, i) => { const mm = parseInt(str(h), 10); if (i && mm >= 1 && mm <= 12 && num(stu[i])) students[`${year}-${p2(mm)}`] = num(stu[i]); });
  }
  return { list, config: { rules, students } };
}

async function importFile(file) {
  let list, cfg;
  try {
    if (/\.json$/i.test(file.name) || file.type === 'application/json') {
      const d = JSON.parse(await file.text());
      if (!d || typeof d.months !== 'object') throw new Error('not backup');
      list = Object.values(d.months).flat();
      cfg = d.config || {};
    } else {
      if (!window.XLSX) throw new Error('no xlsx');
      ({ list, config: cfg } = parseLedgerWorkbook(XLSX.read(await file.arrayBuffer(), { type: 'array' })));
      // 수기 장부 형식이 아니면 은행 거래내역 파일로 보고 확인 화면으로 보낸다
      if (!list.length) { S.tab = 'upload'; return readBankFile(file); }
    }
  } catch (e) { toast('파일을 읽지 못했어요. 엑셀 장부나 백업 파일인지 확인해주세요'); return; }
  const { added, months } = mergeTx(list);
  S.config.rules = { in: { ...(cfg.rules?.in || {}), ...S.config.rules.in }, out: { ...(cfg.rules?.out || {}), ...S.config.rules.out } };
  S.config.students = { ...(cfg.students || {}), ...S.config.students };
  if (cfg.tuition > 0 && !Object.keys(S.months).some(m => !months.includes(m) && S.months[m].length)) S.config.tuition = cfg.tuition;
  for (const m of months) await saveMonth(m);
  await saveConfig();
  if (!added) { toast('새로 넣을 거래가 없었어요 (모두 이미 있어요)'); render(); return; }
  S.month = months.at(-1);
  toast(`거래 ${added}건을 가져왔어요`);
  S.tab = 'dash'; render(); window.scrollTo({ top: 0 });
}
