    if (!st[i].count) return;
    const rows = [['거래일시', '구분', '입금(원)', '출금(원)', '거래후잔액(원)', '거래처', '메모', '항목']]
      .concat(st[i].items.slice().sort((a, b) => a.dt.localeCompare(b.dt)).map(t => [t.dt, t.dir === 'in' ? '입금' : '출금', t.dir === 'in' ? t.amount : '', t.dir === 'out' ? t.amount : '', t.bal ?? '', t.name, t.memo || '', t.cat]));
    const s = XLSX.utils.aoa_to_sheet(rows);
    s['!cols'] = [{ wch: 20 }, { wch: 6 }, { wch: 12 }, { wch: 12 }, { wch: 14 }, { wch: 22 }, { wch: 12 }, { wch: 10 }];
    XLSX.utils.book_append_sheet(wb, s, `${+m.slice(5)}월입출금`);
  });
  const data = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
  try {
    if (await saveFile(`academy-ledger-${year}.xlsx`, new Uint8Array(data), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')) toast('엑셀 파일을 저장했어요');
  } catch (e) { toast('파일을 저장하지 못했어요'); }
}

async function aiReport() {
  if (!aiMode()) return;
  const m = S.month, st = stats(m);
  const hist = monthList().filter(x => x <= m).slice(-6).map(x => { const s = stats(x); return `${x}: 수입 ${s.inc}, 지출 ${s.exp}, 순이익 ${s.net}, 수강료 ${s.tuition}`; }).join('\n');
  const cats = OUT_CATS.filter(c => c !== '통장이동').map(c => `${c} ${st.byCat[c] || 0} (전월 ${stats(shiftMonth(m, -1)).byCat[c] || 0})`).join(', ');
  const top = st.items.filter(isExpense).sort((a, b) => b.amount - a.amount).slice(0, 8).map(t => `${t.name} ${t.amount}(${t.cat})`).join(', ');
  const prompt = `당신은 작은 미술학원 원장님의 장부를 봐주는 회계 도우미입니다. 아래 숫자만 근거로, ${mLabel(m)} 손익을 한국어로 짧게 정리해 주세요.
형식: 5줄 이내, 각 줄은 "• "로 시작, 금액은 만원 단위로, 친근한 해요체. 마크다운 굵게/표 없이 평문으로.
내용: ① 이번 달 한 줄 결론 ② 전월·최근 흐름 대비 눈에 띄는 변화 ③ 늘어난 지출 항목 ④ 수강료/원생 관련 ⑤ 다음 달에 해볼 만한 한 가지.

최근 월별(원):
${hist}
이번 달 항목별 지출(원): ${cats}
큰 지출: ${top}
재원생 수(참고): ${S.config.students?.[m] ?? '미입력'}, 수강료 4회 ${S.config.tuition}원, 결제 건수 추정 ${st.payCnt}건, 카드 수수료 추정 ${st.cardFee}원.
참고: 이 학원은 4회분을 3회차에 미리 결제하고, 보강·이월이 있으면 결제가 다음 달로 밀리며, 카드 결제는 3일 뒤 정산돼 월말 결제가 다음 달 입금으로 잡힐 수 있어요. 한 달 수강료가 적다고 바로 미납으로 단정하지 마세요.`;
  const out = $('#aiOut'), btn = $('#aiBtn');
  btn.disabled = true; out.classList.remove('muted'); out.textContent = '분석하고 있어요…';
  try {
    S.ai[m] = await aiText(prompt, text => { out.textContent = text; });
    out.textContent = S.ai[m];
  } catch (e) {
    out.textContent = e instanceof AIError ? e.message : e?.text || (e?.code === 'not_granted' ? 'Claude 사용을 허용해야 리포트를 만들 수 있어요.' : e?.code === 'rate_limited' ? '요청이 많아요. 잠시 뒤 다시 눌러주세요.' : '리포트를 만들지 못했어요. 다시 눌러주세요.');
  }
  btn.disabled = false; btn.textContent = '다시 분석하기';
}

/* ───────── 이벤트 ───────── */
document.addEventListener('click', async e => {
  if (e.target.id === 'dim') { closeSheet(); return; }
  const t = e.target.closest('button, [data-go]');
  if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; render(); window.scrollTo({ top: 0 }); return; }
  if (t.dataset.go) { S.tab = t.dataset.go; render(); window.scrollTo({ top: 0 }); return; }
  if (t.id === 'monthBtn') { openMonths(); return; }
  if (t.dataset.month) { S.month = t.dataset.month; closeSheet(); render(); return; }
  if (t.id === 'prevM' || t.id === 'nextM') { const ms = monthList(); const i = ms.indexOf(S.month) + (t.id === 'prevM' ? -1 : 1); if (ms[i]) { S.month = ms[i]; render(); } return; }
  if (t.dataset.rm != null) { e.preventDefault(); const [p] = S.pending.splice(+t.dataset.rm, 1); URL.revokeObjectURL(p.url); render(); return; }
  if (t.id === 'readBtn') { readShots(); return; }
  if (t.id === 'cancelReview') { S.review = null; render(); return; }
  if (t.id === 'saveReview') { t.disabled = true; saveReview(); return; }
  if (t.dataset.keep != null) { const r = S.review[+t.dataset.keep]; r.keep = !r.keep; render(); return; }
  if (t.dataset.rcat != null) { openReviewCat(+t.dataset.rcat); return; }
  if (t.dataset.rsetcat) { const r = S.review[S.sheetReview]; r.cat = t.dataset.rsetcat; r.how = 'user'; closeSheet(); render(); return; }
  if (t.dataset.f) { S.filter = t.dataset.f; S.catFilter = null; render(); return; }
  if (t.dataset.cat) { S.catFilter = t.dataset.cat; S.filter = 'all'; S.tab = 'list'; render(); window.scrollTo({ top: 0 }); return; }
  if (t.hasAttribute('data-clearcat')) { S.catFilter = null; render(); return; }
  if (t.dataset.open) { openTx(t.dataset.open); return; }
  if (t.dataset.setcat) { const id = S.sheetTx; closeSheet(); changeCat(id, t.dataset.setcat); return; }
  if (t.id === 'delTx') {
    if (!t.dataset.armed) { t.dataset.armed = '1'; t.textContent = '한 번 더 누르면 삭제돼요'; return; }
    const id = S.sheetTx;
    for (const m of Object.keys(S.months)) {
      const i = S.months[m].findIndex(x => x.id === id);
      if (i >= 0) { S.months[m].splice(i, 1); closeSheet(); await saveMonth(m); toast('삭제했어요'); render(); return; }
    }
    return;
  }
  if (t.id === 'addBtn') { openAdd(); return; }
  if (t.id === 'editTx') { openEdit(S.sheetTx); return; }
  if (t.id === 'delMonth') { openDeleteMonth(); return; }
  if (t.id === 'delMonthGo') { t.disabled = true; deleteMonth(); return; }
  if (t.id === 'sheetClose') { closeSheet(); return; }
  if (t.id === 'aiBtn') { aiReport(); return; }
  if (t.id === 'aiAllBtn') { aiReportAll(); return; }
  if (t.dataset.summode) { S.sumMode = t.dataset.summode; render(); return; }
  if (t.dataset.range) { S.range = t.dataset.range; S.aiAll = ''; render(); return; }
  if (t.id === 'xlsxBtn') { exportXlsx(); return; }
  if (t.id === 'backupBtn') { exportBackup(); return; }
  if (t.dataset.cloud === 'in') { cloudSignIn(); return; }
  if (t.dataset.cloud === 'out') { cloudSignOut(); return; }
  if (t.dataset.prov) { AI.provider = t.dataset.prov; saveAI(); render(); return; }
  if (t.id === 'aiSave') { saveAIKey(); return; }
  if (t.id === 'aiClear') { AI.keys[AI.provider] = ''; AI.lists[AI.provider] = []; S.aiStatus = null; saveAI(); render(); toast('키를 지웠어요'); return; }
  if (t.id === 'kwAdd') { addKwRules(); return; }
  if (t.id === 'kwApply') { t.disabled = true; applyKwRules(); return; }
  if (t.dataset.kwdel != null) { S.config.kwRules.splice(+t.dataset.kwdel, 1); await saveConfig(); render(); toast('규칙을 지웠어요'); return; }
  if (t.dataset.rule) {
    const [d, ...k] = t.dataset.rule.split('|');
    delete S.config.rules[d][k.join('|')];
    await saveConfig(); render(); toast('규칙을 지웠어요');
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'fileIn') { addFiles(t.files); t.value = ''; }
  if (t.id === 'importIn') { const f = t.files[0]; t.value = ''; if (f) importFile(f); }
  if (t.id === 'bankIn') { const f = t.files[0]; t.value = ''; if (f) readBankFile(f); }
  if (t.id === 'aiModel') { AI.models[AI.provider] = t.value; saveAI(); toast(`${t.value}로 읽을게요`); }
  if (t.id === 'stuIn') {
    const n = parseInt(t.value, 10);
    if (Number.isFinite(n) && n >= 0) S.config.students[S.month] = n; else delete S.config.students[S.month];
    await saveConfig(); render();
  }
  if (t.id === 'eDir') $('#eCat').innerHTML = (t.value === 'in' ? IN_CATS : OUT_CATS).map(c => `<option>${c}</option>`).join('');
  if (t.id === 'aDir') $('#aCat').innerHTML = (t.value === 'in' ? IN_CATS : OUT_CATS).map(c => `<option>${c}</option>`).join('');
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.query = e.target.value; renderList(); }
  // 설정 화면 전체를 다시 그리면 검색칸이 새로 만들어져 한글 입력이 끊기므로 목록만 바꾼다
  if (e.target.id === 'ruleQ') { S.ruleQ = e.target.value; $('#ruleRows').innerHTML = ruleRowsHTML(); }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'addForm') {
    const dt = $('#aDate').value, amount = parseInt($('#aAmt').value, 10), name = $('#aName').value.trim();
    if (!dt || !amount || !name) return;
    const t = { id: hash(dt + name + amount + Date.now()), dt, dir: $('#aDir').value, amount, name, memo: '직접입력', bal: null, cat: $('#aCat').value, src: 'manual' };
    const m = dt.slice(0, 7);
    (S.months[m] = S.months[m] || []).push(t);
    closeSheet();
    await saveMonth(m);
    S.month = m; toast('추가했어요'); render();
  }
  if (e.target.id === 'editForm') { saveEdit(); return; }
  if (e.target.id === 'cfgForm') {
    const n = parseInt($('#cTuition').value, 10), f = parseFloat($('#cFee').value);
    if (n > 0) { S.config.tuition = n; if (Number.isFinite(f) && f >= 0 && f < 20) S.config.cardFee = f; await saveConfig(); toast('저장했어요'); render(); }
  }
});
const drop = () => $('#drop');
document.addEventListener('dragover', e => { if (S.tab === 'upload' && !S.review) { e.preventDefault(); drop()?.classList.add('over'); } });
document.addEventListener('dragleave', e => { if (e.target === drop()) drop().classList.remove('over'); });
document.addEventListener('drop', e => {
  if (S.tab !== 'upload' || S.review) return;
  e.preventDefault(); drop()?.classList.remove('over');
  const files = [...e.dataTransfer.files];
  const sheet = files.find(f => /\.(xlsx?|csv)$/i.test(f.name));
  if (sheet) readBankFile(sheet); else addFiles(files);
});
document.addEventListener('paste', e => { const f = [...(e.clipboardData?.files || [])]; if (f.length && !S.review) { S.tab = 'upload'; addFiles(f); } });
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (S.tab === 'insights') renderInsights(); else drawChart(); }, 150); });

init();
})();
</script>
</body>
